<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🦋 こんちゅうさいしゅう！</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
  html,body { width:100%; height:100%; overflow:hidden; margin:0; padding:0; }
  * { box-sizing:border-box; touch-action:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  body { background:#123; font-family:'Nunito',sans-serif; }
  #wrapper { position:fixed; top:0; left:0; right:0; bottom:0; overflow:hidden; }
  #gameCanvas { display:block; width:100%; height:100%; }
  .screen { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
  .hidden { display:none !important; }

  /* タイトル */
  #titleScreen { background:linear-gradient(180deg,#0f3d2e 0%,#2e7d32 50%,#7cb342 100%); }
  .title-emoji { font-size:70px; animation:bounce 1.6s ease-in-out infinite; display:block; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  .title-main { color:#ffe66d; font-size:29px; font-weight:900; text-align:center; text-shadow:0 3px 12px rgba(0,0,0,0.5); margin:10px 0 6px; }
  .title-sub { color:rgba(255,255,255,0.85); font-size:13px; text-align:center; line-height:1.95; margin-bottom:20px; }
  .btn-start { background:linear-gradient(135deg,#ffe66d,#f77f00); color:#fff; border:none; border-radius:30px; padding:15px 46px; font-size:22px; font-weight:900; font-family:'Nunito',sans-serif; cursor:pointer; box-shadow:0 4px 20px rgba(255,230,109,0.45); }
  .btn-start:active { transform:scale(0.95); }

  .btn-green { background:linear-gradient(135deg,#66bb6a,#2e7d32); color:#fff; border:none; border-radius:26px; padding:12px 26px; font-size:17px; font-weight:900; font-family:'Nunito',sans-serif; cursor:pointer; }
  .btn-gray  { background:rgba(255,255,255,0.13); color:#fff; border:2px solid rgba(255,255,255,0.3); border-radius:26px; padding:11px 22px; font-size:16px; font-weight:900; font-family:'Nunito',sans-serif; cursor:pointer; }
  .btn-green:active,.btn-gray:active { transform:scale(0.95); }
  .btn-row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:14px; }

  /* ばしょえらび */
  #stageScreen { background:rgba(8,32,18,0.97); backdrop-filter:blur(12px); }
  .sel-title { color:#ffe66d; font-size:22px; font-weight:900; margin-bottom:4px; text-align:center; }
  .sel-sub { color:rgba(255,255,255,0.6); font-size:12px; margin-bottom:16px; text-align:center; line-height:1.7; }
  .stage-cards { display:flex; flex-direction:column; gap:9px; width:100%; max-width:400px; }
  .stage-card { background:rgba(255,255,255,0.09); border:2px solid rgba(255,255,255,0.16); border-radius:18px; padding:12px 15px; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .stage-card:active { transform:scale(0.97); background:rgba(255,255,255,0.16); }
  .stage-card.locked { opacity:0.45; }
  .sc-icon { font-size:32px; flex-shrink:0; }
  .sc-name { color:#fff; font-size:16px; font-weight:900; }
  .sc-desc { color:rgba(255,255,255,0.62); font-size:11px; margin-top:2px; line-height:1.5; }

  /* HUD */
  #hud { position:absolute; top:0; left:0; right:0; padding:10px 12px; display:flex; justify-content:space-between; align-items:flex-start; z-index:10; pointer-events:none; }
  .chip { background:rgba(0,0,0,0.42); backdrop-filter:blur(4px); border-radius:16px; padding:5px 13px; color:#fff; font-size:13px; font-weight:900; }
  .chip.gold { color:#ffe66d; }
  #hudBtns { display:flex; gap:7px; pointer-events:auto; }
  .mini-btn { background:rgba(0,0,0,0.45); border:2px solid rgba(255,255,255,0.22); border-radius:14px; color:#fff; font-size:13px; font-weight:900; font-family:'Nunito',sans-serif; padding:5px 11px; cursor:pointer; }
  .mini-btn:active { transform:scale(0.93); }
  #tipBar { position:absolute; bottom:18px; left:0; right:0; text-align:center; z-index:10; pointer-events:none; transition:opacity 0.5s; }
  #tipBar span { background:rgba(0,0,0,0.45); border-radius:18px; padding:7px 18px; color:#fff; font-size:13px; font-weight:900; display:inline-block; }
  #tipBar.fade { opacity:0; }

  /* けっか */
  #clearScreen { background:rgba(8,32,18,0.94); backdrop-filter:blur(10px); }
  .res-emoji { font-size:66px; animation:epop 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
  @keyframes epop { from{transform:scale(0)} to{transform:scale(1)} }
  .res-title { color:#fff; font-size:26px; font-weight:900; text-align:center; margin:8px 0 6px; }
  .res-note { color:rgba(255,255,255,0.8); font-size:14px; font-weight:900; text-align:center; line-height:2; white-space:pre-line; }

  /* ずかん */
  #zukanScreen { background:rgba(8,32,18,0.97); backdrop-filter:blur(12px); justify-content:flex-start; padding-top:22px; overflow-y:auto; }
  .zk-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; width:100%; max-width:430px; margin-top:10px; }
  .zk-cell { background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.14); border-radius:15px; padding:8px; text-align:center; }
  .zk-cell.got { border-color:#ffe66d; background:rgba(255,230,109,0.12); }
  .zk-name { color:#fff; font-size:12px; font-weight:900; margin-top:2px; line-height:1.35; }
  .zk-cell.miss .zk-name { color:rgba(255,255,255,0.35); }
  .zk-best { color:#ffe66d; font-size:11px; font-weight:900; margin-top:2px; }
  .zk-q { font-size:32px; color:rgba(255,255,255,0.25); font-weight:900; line-height:46px; }
  .zk-cv { width:120px; height:46px; display:block; margin:0 auto; }
  .credit { color:rgba(255,255,255,0.42); font-size:11px; font-weight:900; margin-top:16px; text-align:center; line-height:1.6; }
  .call-btn { margin-top:6px; background:rgba(255,230,109,0.16); border:2px solid rgba(255,230,109,0.55);
    border-radius:14px; color:#ffe66d; font-size:12px; font-weight:900; font-family:'Nunito',sans-serif;
    padding:5px 12px; cursor:pointer; }
  .call-btn:active { transform:scale(0.93); }
  .call-btn.playing { background:#ffe66d; color:#4a3600; animation:callpulse 0.6s ease-in-out infinite alternate; }
  @keyframes callpulse { from{transform:scale(1)} to{transform:scale(1.07)} }

  /* エフェクト */
  .pop-text { position:absolute; z-index:11; font-size:19px; font-weight:900; font-family:'Nunito',sans-serif; pointer-events:none; animation:popup 1.1s ease-out forwards; transform:translateX(-50%); text-shadow:0 2px 7px rgba(0,0,0,0.7); white-space:nowrap; }
  @keyframes popup { 0%{transform:translateX(-50%) translateY(0) scale(1.15);opacity:1} 100%{transform:translateX(-50%) translateY(-64px) scale(0.85);opacity:0} }
  .confetti { position:absolute; width:9px; height:9px; pointer-events:none; border-radius:2px; animation:cffall linear forwards; z-index:12; }
  @keyframes cffall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(900px) rotate(720deg);opacity:0} }
  #newBanner { position:absolute; top:96px; left:0; right:0; text-align:center; z-index:12; pointer-events:none; }
  #newBanner div { display:inline-block; background:linear-gradient(135deg,#ffe66d,#f77f00); color:#4a2c00; font-size:16px; font-weight:900; border-radius:16px; padding:8px 20px; box-shadow:0 4px 16px rgba(0,0,0,0.4); animation:epop 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
</style>
</head>
<body>
<div id="wrapper">
  <canvas id="gameCanvas"></canvas>

  <div id="hud" class="hidden">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div class="chip" id="stageChip"></div>
      <div class="chip gold" id="countChip"></div>
    </div>
    <div id="hudBtns">
      <button class="mini-btn" onclick="openZukan('game')">📖 ずかん</button>
      <button class="mini-btn" onclick="showStageSelect()">🗺</button>
    </div>
  </div>
  <div id="tipBar" class="hidden"><span></span></div>
  <div id="newBanner" class="hidden"></div>

  <!-- タイトル -->
  <div class="screen" id="titleScreen">
    <span class="title-emoji">🦋</span>
    <div class="title-main">こんちゅう<br>さいしゅう！</div>
    <div class="title-sub">
      ゆびで むしあみを うごかそう✋<br>
      むしに あみを かぶせて つかまえる！<br>
      ちょうちょ・とんぼ・セミ・カブトムシ🪲<br>
      スズムシ・コオロギも いるよ🎵<br>
      ずかんで なきごえも きけるよ📖
    </div>
    <button class="btn-start" onclick="showStageSelect()">▶ スタート！</button>
    <div class="btn-row"><button class="btn-gray" onclick="openZukan('title')">📖 ずかんを みる</button></div>
    <div id="creditT" class="credit hidden"></div>
  </div>

  <!-- ばしょえらび -->
  <div class="screen hidden" id="stageScreen">
    <div class="sel-title">🌳 ばしょを えらぼう！</div>
    <div class="sel-sub">５ひき つかまえたら つぎの ばしょへ いけるよ</div>
    <div class="stage-cards" id="stageCards"></div>
    <div class="btn-row">
      <button class="btn-gray" onclick="openZukan('stage')">📖 ずかん</button>
      <button class="btn-gray" onclick="showTitle()">🏠 タイトル</button>
    </div>
  </div>

  <!-- クリア -->
  <div class="screen hidden" id="clearScreen">
    <div class="res-emoji" id="clEmoji">🎉</div>
    <div class="res-title" id="clTitle"></div>
    <div class="res-note" id="clNote"></div>
    <div class="btn-row" id="clBtns"></div>
  </div>

  <!-- ずかん -->
  <div class="screen hidden" id="zukanScreen">
    <div class="sel-title">📖 こんちゅうずかん</div>
    <div class="sel-sub" id="zukanCount"></div>
    <div class="zk-grid" id="zukanGrid"></div>
    <div class="btn-row"><button class="btn-green" id="zukanBack">◀ もどる</button></div>
    <div id="creditZ" class="credit hidden"></div>
  </div>
</div>

<script>
const canvas=document.getElementById('gameCanvas'), ctx=canvas.getContext('2d');
const wrapper=document.getElementById('wrapper');
function resize(){ canvas.width=wrapper.clientWidth; canvas.height=wrapper.clientHeight; }
resize(); window.addEventListener('resize',resize);
const el=id=>document.getElementById(id);
const RND=(a,b)=>a+Math.random()*(b-a);

/* ===== にげる はやさ（とんぼを 1 とした ばあい）=====
   とんぼ  : 330 px/s  （そのまま）
   セミ    : 330 px/s  （とんぼと おなじ）
   ちょうちょ: 165 px/s （とんぼの 1/2）
   クワガタ : 83 px/s  （とんぼの 1/4・じゅえきから ゆっくり にげる） */
const SPEED_TONBO = 330;
const SPEED_SEMI  = SPEED_TONBO;
const SPEED_CHO   = SPEED_TONBO/2;
const SPEED_KUWA  = SPEED_TONBO/4;
/* スズムシ・コオロギ : とんぼの 1.5ばい ＝ 495 px/s */
const SPEED_KORO  = SPEED_TONBO*1.5;

/* ===== おと ===== */
let ac=null;
function getAC(){ if(!ac) ac=new(window.AudioContext||window.webkitAudioContext)(); return ac; }
function tone(f,d,ty,v,dl){ try{ const a=getAC(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.type=ty||'sine';o.frequency.value=f;
  const t=a.currentTime+(dl||0); g.gain.setValueAtTime(v||0.15,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+d); o.start(t);o.stop(t+d);}catch(e){} }
function noise(d,v){ try{ const a=getAC(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(),g=a.createGain(); s.buffer=b; s.connect(g); g.connect(a.destination);
  g.gain.value=v||0.08; s.start(); }catch(e){} }
function sfx(n){
  if(n==='catch'){ [660,880,1100].forEach((f,i)=>tone(f,0.16,'sine',0.16,i*0.07)); }
  else if(n==='rare'){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.28,'sine',0.17,i*0.1)); }
  else if(n==='escape'){ tone(420,0.16,'sine',0.11,0); tone(260,0.2,'sine',0.09,0.1); }
  else if(n==='jiji'){ noise(0.35,0.06); }
  else if(n==='hold'){ tone(880,0.06,'square',0.07,0); }
  else if(n==='chirp'){ tone(4400,0.16,'sine',0.07,0); tone(4400,0.16,'sine',0.06,0.22); }
  else if(n==='clear'){ [523,659,784,659,784,1047].forEach((f,i)=>tone(f,0.3,'sine',0.18,i*0.13)); }
}

/* ===== なきごえ（ずかんで きける）=====
   ほんものの むしは「はねを こすって」ないている。
   → たんなる ピー音では なく、
     ①キャリア音（きほんの たかさ）＋ばいおん
     ②パルスれつ（1びょうに 何十かいの こきざみ）
     ③しゅるいに よって ノイズ（ザラつき）
     ④リズム（チンチロリン などの ならびかた）
   の 4つを サンプルたんいで 合成している。
=================================================== */
let callSrc=null, callTimer=null, callBufs={}, callAudio=null, audioCache={};

function stopCall(){
  if(callSrc){ try{ callSrc.stop(0); }catch(e){} try{ callSrc.disconnect(); }catch(e){} callSrc=null; }
  if(callAudio){ try{ callAudio.pause(); callAudio.currentTime=0; }catch(e){} callAudio=null; }
  if(callTimer){ clearTimeout(callTimer); callTimer=null; }
}

/* おんぱを 1サンプルずつ つくる */
function renderSong(sr,syls){
  let dur=0; syls.forEach(s=>dur=Math.max(dur,s.t+s.d));
  dur+=0.15;
  const n=Math.ceil(sr*dur), out=new Float32Array(n);
  for(const s of syls){
    const i0=Math.floor(s.t*sr), len=Math.floor(s.d*sr);
    const harm=s.harm||[1,0.28,0.1];
    let hsum=0; harm.forEach(h=>hsum+=h);
    // ノイズよう バンドパス（ステート・バリアブル・フィルター）
    let lp=0, bp=0;
    const fc=2*Math.sin(Math.PI*Math.min(0.45,s.f/sr)), qq=1/(s.q||3);
    let ph=0;
    const atk=s.atk||0.008, rel=s.rel||0.03, duty=s.duty||0.6, psh=s.pshape||1.1;
    // ほんものらしい ゆらぎ（まったく おなじ おとの くりかえしは きかいっぽい）
    const jf=1+(Math.random()-0.5)*0.030, ja=1+(Math.random()-0.5)*0.16;
    const wob=s.wob||0;
    for(let i=0;i<len;i++){
      const idx=i0+i; if(idx>=n) break;
      const t=i/sr;
      const f=(s.f+(s.glide||0)*(t/s.d))*jf;
      ph+=2*Math.PI*f/sr;
      // パルスれつ（はねを こする こきざみ）
      let pe=1;
      if(s.pr){
        const q=(t*s.pr)%1;
        pe = q<duty ? Math.pow(1-q/duty,psh) : 0;
        pe = pe*0.88+0.12;
      }
      // シラブル ぜんたいの エンベロープ
      const se=Math.min(1,t/atk)*Math.min(1,(s.d-t)/rel);
      // キャリア＋ばいおん
      let v=0; for(let k=0;k<harm.length;k++) v+=harm[k]*Math.sin(ph*(k+1));
      v/=hsum;
      // ノイズ（セミの ザラつき）
      let mix=v;
      if(s.noise){
        const x=Math.random()*2-1;
        lp+=fc*bp; const hi=x-lp-qq*bp; bp+=fc*hi;
        mix=(1-s.noise)*v+s.noise*bp*2.4;
      }
      const breath = wob? 1+wob*Math.sin(2*Math.PI*3.1*t) : 1;
      out[idx]+=(s.a||0.5)*ja*breath*se*pe*mix;
    }
  }
  for(let i=0;i<n;i++) out[i]=Math.tanh(out[i]*1.25)*0.82;
  // さいごを フェードアウト
  const fade=Math.floor(sr*0.06);
  for(let i=0;i<fade;i++) out[n-1-i]*=i/fade;
  return out;
}

/* しゅるいごとの「うた」の せっけいず */
function songOf(kind){
  const S=[], push=o=>S.push(o);
  if(kind==='suzu'){
    /* スズムシ「リーン…リーン…」4.3kHz の すんだ ベルのような おと
       こまかい ふるえ（パルス 58/びょう）＋ゆっくりした くりかえし */
    for(let i=0;i<4;i++) push({t:i*0.80, d:0.46, f:4300, harm:[1,0.16,0.05],
      pr:58, duty:0.82, pshape:0.7, atk:0.015, rel:0.16, a:0.52});
  }
  else if(kind==='enma'){
    /* エンマコオロギ「コロ コロ コロ リーーー」4.0kHz
       みじかい 3つ＋ながい 1つ で 1セット */
    for(let g=0;g<3;g++){ const b=g*1.20;
      for(let i=0;i<3;i++) push({t:b+i*0.155, d:0.075, f:4050, harm:[1,0.3,0.12],
        pr:46, duty:0.6, atk:0.004, rel:0.022, a:0.5});
      push({t:b+0.50, d:0.42, f:3980, harm:[1,0.3,0.12], pr:44, duty:0.68,
        atk:0.012, rel:0.10, a:0.5});
    }
  }
  else if(kind==='matsu'){
    /* マツムシ「チン・チロ・リン」4.7kHz の 3おんぷ */
    for(let g=0;g<3;g++){ const b=g*1.05;
      push({t:b,      d:0.115, f:4780, harm:[1,0.22,0.08], pr:72, duty:0.78, atk:0.006, rel:0.035, a:0.52});
      push({t:b+0.18, d:0.105, f:4620, harm:[1,0.22,0.08], pr:72, duty:0.78, atk:0.006, rel:0.035, a:0.52});
      push({t:b+0.35, d:0.28,  f:4420, harm:[1,0.20,0.07], pr:64, duty:0.82, atk:0.008, rel:0.11,  a:0.52});
    }
  }
  else if(kind==='kantan'){
    /* カンタン「ルルルルル…」2.6kHz・やわらかい れんぞくトリル */
    push({t:0, d:2.9, f:2600, harm:[1,0.2,0.07], pr:42, duty:0.55, pshape:1.5,
      atk:0.30, rel:0.45, a:0.44, wob:0.13});
  }
  else if(kind==='abura'){
    /* アブラゼミ「ジー ジリジリジリ」あぶらで あげる ような ザラつき
       ノイズ 7わり＋パルス 46/びょう */
    push({t:0, d:3.0, f:4300, q:1.7, noise:0.72, harm:[1,0.5,0.28],
      pr:46, duty:0.62, pshape:0.9, atk:0.30, rel:0.35, a:0.58, wob:0.16});
    push({t:0.06, d:2.9, f:6400, q:1.1, noise:0.92, pr:46, duty:0.5,
      atk:0.35, rel:0.35, a:0.26});
  }
  else if(kind==='minmin'){
    /* ミンミンゼミ「ミーーン ミンミンミン ミーン」
       はじめに 音が あがり、みじかい ミンを くりかえし、さいごに さがる */
    const base={harm:[1,0.55,0.3], noise:0.22, q:2.4, pr:96, duty:0.82};
    push({...base, t:0,    d:0.90, f:3400, glide:950, atk:0.14, rel:0.06, a:0.50});
    let t=1.00;
    for(let i=0;i<6;i++) push({...base, t:t+i*0.30, d:0.205, f:4320,
      atk:0.018, rel:0.05, a:0.53});
    t+=6*0.30+0.04;
    push({...base, t, d:0.70, f:4320, glide:-1600, atk:0.03, rel:0.40, a:0.46});
  }
  else if(kind==='tsuku'){
    /* ツクツクボウシ「オーシー ツクツク×n ツクリヨーシ」 */
    const base={harm:[1,0.45,0.22], noise:0.3, q:2.0};
    push({...base, t:0, d:0.80, f:4100, glide:1000, pr:112, duty:0.86, atk:0.18, rel:0.07, a:0.46});
    let t=0.92;
    for(let i=0;i<9;i++){
      push({...base, t,        d:0.085, f:5250, pr:125, duty:0.8, atk:0.005, rel:0.025, a:0.52});
      push({...base, t:t+0.115,d:0.090, f:4550, pr:125, duty:0.8, atk:0.005, rel:0.028, a:0.52});
      t+=0.30-i*0.011;
    }
    push({...base, t:t+0.06, d:0.60, f:4700, glide:-1500, pr:112, duty:0.86,
      atk:0.02, rel:0.34, a:0.46});
  }
  else if(kind==='higu'){
    /* ヒグラシ「カナカナカナカナ…」きんぞくてきな ひびき。
       「カナ」を 1びょうに 9〜10かい。さいごは だんだん おそく・ひくく なる */
    const base={harm:[1,0.6,0.35,0.18], noise:0.14, q:2.6, duty:0.6, pshape:0.85};
    let t=0.05, iv=0.145, f=4150;
    for(let i=0;i<30;i++){
      const fade = i<3 ? 0.45+i*0.2 : 1;              // はじめは そっと
      const slow = i>22 ? (i-22)*0.016 : 0;           // さいごは ゆっくり
      const drop = i>22 ? (i-22)*90 : 0;              // さいごは ひくく
      push({...base, t, d:0.082, f:f-drop,     pr:230, atk:0.005, rel:0.03, a:0.5*fade});
      push({...base, t:t+0.062, d:0.062, f:f-260-drop, pr:200, atk:0.005, rel:0.028, a:0.42*fade});
      t += iv + slow;
      if(i<6) iv = Math.max(0.104, iv-0.007);         // はじめは だんだん はやく
    }
  }
  else if(kind==='kuma'){
    /* クマゼミ「シャシャシャシャ」3.4kHz の ノイズを 1びょうに 8かい */
    for(let i=0;i<24;i++) push({t:0.12+i*0.122, d:0.10, f:3400, q:1.3, noise:0.86,
      harm:[1,0.6,0.4], pr:175, duty:0.62, atk:0.006, rel:0.05, a:0.6});
  }
  return S;
}

function playCall(kind){
  stopCall();
  // ほんものの おんげんファイルが あれば そちらを ながす
  if(CALL_FILES[kind]){
    try{
      let el=audioCache[kind];
      if(!el){ el=new Audio(CALL_FILES[kind]); el.preload='auto'; audioCache[kind]=el; }
      el.onended=()=>{ document.querySelectorAll('button[data-call].playing')
        .forEach(b=>b.classList.remove('playing')); stopCall(); };
      try{ el.currentTime=0; }catch(e){}
      el.volume=0.9; callAudio=el;
      el.play().catch(()=>{});
      const d=(isFinite(el.duration)&&el.duration>0)?el.duration:6.5;
      callTimer=setTimeout(stopCall,(d+0.4)*1000);
      return d;
    }catch(e){}
  }
  let a; try{ a=getAC(); if(a.state==='suspended') a.resume(); }catch(e){ return; }
  const key=kind+'@'+a.sampleRate;
  if(!callBufs[key]){
    const data=renderSong(a.sampleRate,songOf(kind));
    const buf=a.createBuffer(1,data.length,a.sampleRate);
    buf.copyToChannel? buf.copyToChannel(data,0) : buf.getChannelData(0).set(data);
    callBufs[key]=buf;
  }
  const buf=callBufs[key];
  const src=a.createBufferSource(); src.buffer=buf;
  const g=a.createGain(); g.gain.value=0.55;
  src.connect(g); g.connect(a.destination);
  src.start(); callSrc=src;
  callTimer=setTimeout(stopCall,(buf.duration+0.2)*1000);
  return buf.duration;
}

  }else if(th==='forest'){
    const n=3; for(let i=0;i<n;i++){ const x=W*(i+0.5)/n+RND(-16,16); trees.push({x,w:RND(52,74)});
      for(let k=0;k<2;k++) perches.push({x:x+RND(-10,10),y:RND(H*0.28,H*0.66),type:'trunk',taken:false}); }
  }else{
    trees.push({x:W*0.5,w:Math.min(150,W*0.42)});

/* ===== むし ===== */
function pickSp(){
  const p=STAGES[stageIdx].pool, arr=[];
  for(const k in p){ for(let i=0;i<p[k];i++) arr.push(k); }
  return arr[Math.floor(Math.random()*arr.length)];
}
function freePerch(kind,awayFromNet){
  let c=perches.filter(p=>!p.taken && (kind==='sap'?p.type==='sap':p.type!=='sap'));
  if(awayFromNet){
    const far=c.filter(p=>Math.hypot(p.x-net.x,p.y-net.y)>230);
    if(far.length) c=far;
  }
  return c.length? c[Math.floor(Math.random()*c.length)] : null;
}
function spawnBug(){
  const W=canvas.width,H=canvas.height;
  const key=pickSp(), s=SP[key];
  let mode=s.mode;
  if(STAGES[stageIdx].theme==='night'&&mode==='cho') mode='sap';
  const b={key,s,mode,anim:RND(0,6),t:0,alive:true,hold:0,alert:0,dir:1};
  if(b.mode==='semi'){
    const p=freePerch('trunk',true);
    if(!p){ b.mode='cho'; }
    else { p.taken=true; b.perch=p; b.x=p.x; b.y=p.y; b.state='calm'; }
  }
  if(b.mode==='sap'){
    const p=freePerch('sap',false);
    if(!p) return;
    p.taken=true; b.perch=p; b.x=p.x; b.y=p.y; b.state='eat';
  }
  if(b.mode==='tonbo'){
    b.x=RND(40,W-40); b.y=RND(H*0.22,H*0.6);
    b.state='fly'; b.vx=RND(-1,1)*120; b.vy=RND(-1,1)*60; b.wait=RND(1.0,2.2);
  }
  if(b.mode==='koro'){
    b.x=RND(50,W-50); b.y=RND(H*0.52,H*0.86);
    b.state='dash'; b.wait=RND(0.35,0.9); b.fleeCD=0;
    koroDir(b);
    b.hop=RND(0,6);
  }
  if(b.mode==='cho'){
    b.x=Math.random()<0.5?-40:W+40; b.y=RND(H*0.18,H*0.72);
    b.vx=(b.x<0?1:-1)*RND(70,110); b.vy=RND(-40,40); b.ph=RND(0,6);
  }
  bugs.push(b);
}
/* スズムシ・コオロギの すすむ むき（よこ むき ちゅうしん・はやさは つねに SPEED_KORO）*/
function koroDir(b){
  const sd=Math.random()<0.5?-1:1, a=RND(-0.5,0.5);
  b.vx=sd*Math.cos(a)*SPEED_KORO;
  b.vy=Math.sin(a)*SPEED_KORO;
}
function removeBug(b){
  b.alive=false; if(b.perch) b.perch.taken=false;
  setTimeout(()=>{ if(scene==='play'&&bugs.length<3) spawnBug(); },500);
}

/* ===== そうさ（むしあみ） ===== */
const NET_DY=-62, NET_RX0=48, NET_RY0=36;
/* あみの おおきさ（ばしょごと）
   よるの くぬぎの木＝クワガタ・カブトは あみを 10% おおきくする */
let netScale=1;
const NET_RX=()=>NET_RX0*netScale, NET_RY=()=>NET_RY0*netScale;
function setNet(cx,cy){
  const r=canvas.getBoundingClientRect(), k=r.width>0?canvas.width/r.width:1;
  net.x=cx*k; net.y=cy*k+NET_DY;
  net.x=Math.max(NET_RX(),Math.min(canvas.width-NET_RX(),net.x));
  net.y=Math.max(NET_RY()+40,Math.min(canvas.height-20,net.y));
}
canvas.addEventListener('touchstart',e=>{ if(scene!=='play')return; e.preventDefault(); getAC();
  net.down=true; net.swing=1; const t=e.changedTouches[0]; setNet(t.clientX,t.clientY); },{passive:false});
canvas.addEventListener('touchmove',e=>{ if(scene!=='play'||!net.down)return; e.preventDefault();
  const t=e.changedTouches[0]; setNet(t.clientX,t.clientY); },{passive:false});
canvas.addEventListener('touchend',()=>{ net.down=false; });
canvas.addEventListener('touchcancel',()=>{ net.down=false; });
canvas.addEventListener('mousedown',e=>{ if(scene!=='play')return; getAC(); net.down=true; net.swing=1; setNet(e.clientX,e.clientY); });
window.addEventListener('mousemove',e=>{ if(scene==='play'&&net.down) setNet(e.clientX,e.clientY); });
window.addEventListener('mouseup',()=>{ net.down=false; });

function inNet(b,pad){ const dx=(b.x-net.x)/(NET_RX()+(pad||0)), dy=(b.y-net.y)/(NET_RY()+(pad||0));
  return dx*dx+dy*dy<=1; }
function netDist(b){ return Math.hypot(b.x-net.x,b.y-net.y); }

/* ===== ループ ===== */
function start(){ stop(); lastT=performance.now(); animId=requestAnimationFrame(loop); }
function stop(){ if(animId){cancelAnimationFrame(animId); animId=null;} }
function loop(ts){ const dt=Math.min((ts-lastT)/1000,0.05); lastT=ts;
  if(scene==='play'){ update(dt); render(); animId=requestAnimationFrame(loop);} else animId=null; }

function update(dt){
  const W=canvas.width,H=canvas.height;
  time+=dt; if(catchCD>0) catchCD-=dt; if(net.swing>0) net.swing-=dt*3;

  for(const b of bugs){
    if(!b.alive) continue;
    b.anim+=dt*(b.mode==='cho'?11:b.mode==='tonbo'?14:b.mode==='koro'?10:b.mode==='sap'?6:4); b.t+=dt;

    if(b.mode==='cho'){
      // ひらひら：あみが ちかづくと にげる
      b.ph+=dt*3;
      const d=netDist(b);
      if(d<170){ const a=Math.atan2(b.y-net.y,b.x-net.x);
        b.vx+=Math.cos(a)*SPEED_CHO*3.4*dt; b.vy+=Math.sin(a)*SPEED_CHO*3.4*dt; }
      b.vx+=RND(-60,60)*dt; b.vy+=RND(-70,70)*dt;
      const lim=SPEED_CHO, sp=Math.hypot(b.vx,b.vy);
      if(sp>lim){ b.vx=b.vx/sp*lim; b.vy=b.vy/sp*lim; }
      b.x+=b.vx*dt; b.y+=(b.vy+Math.sin(b.ph)*26)*dt;
      if(b.x<-70||b.x>W+70||b.y<-60||b.y>H+60){ removeBug(b); continue; }
      b.y=Math.max(60,Math.min(H*0.88,b.y));
      b.dir=b.vx>=0?1:-1;
      if(catchCD<=0&&inNet(b,-6)) doCatch(b);
    }
    else if(b.mode==='tonbo'){
      if(b.state==='fly'){
        b.wait-=dt;
        const d=netDist(b);
        if(d<130){ // すいっと にげる
          const a=Math.atan2(b.y-net.y,b.x-net.x);
          b.vx=Math.cos(a)*SPEED_TONBO; b.vy=Math.sin(a)*SPEED_TONBO; b.wait=Math.max(b.wait,0.8);
        }
        b.x+=b.vx*dt; b.y+=b.vy*dt;
        if(b.x<40||b.x>W-40) b.vx*=-1;
        if(b.y<70||b.y>H*0.75) b.vy*=-1;
        b.x=Math.max(35,Math.min(W-35,b.x)); b.y=Math.max(65,Math.min(H*0.76,b.y));
        b.dir=b.vx>=0?1:-1;
        if(b.wait<=0){
          const p=freePerch('reed');
          if(p){ p.taken=true; b.perch=p; b.state='land'; b.lt=0; b.sx=b.x; b.sy=b.y; }
          else { b.wait=RND(0.8,1.6); b.vx=RND(-1,1)*140; b.vy=RND(-1,1)*70; }
        }
      }else if(b.state==='land'){
        b.lt+=dt*2.2; const k=Math.min(1,b.lt);
        b.x=b.sx+(b.perch.x-b.sx)*k; b.y=b.sy+(b.perch.y-b.sy)*k;
        if(k>=1){ b.state='perch'; b.rest=RND(1.8,3.2); }
      }else if(b.state==='perch'){
        b.rest-=dt;
        if(catchCD<=0&&inNet(b,-4)){ doCatch(b); continue; }
        if(b.rest<=0){ b.perch.taken=false; b.perch=null; b.state='fly';
          b.vx=RND(-1,1)*150; b.vy=RND(-1,1)*80; b.wait=RND(1.2,2.4); }
      }
    }
    else if(b.mode==='semi'){
      const d=netDist(b);
      if(b.state==='calm'){
        if(d<155&&b.t>0.8){ b.state='alert'; b.alert=0; sfx('jiji'); }
      }else if(b.state==='alert'){
        b.alert+=dt;
        if(Math.floor(b.alert*4)!==Math.floor((b.alert-dt)*4)) sfx('jiji');
        if(d>210){ b.state='calm'; b.alert=0; }
        if(b.alert>1.35){ // にげる
          b.state='away';
          const ang=RND(-2.5,-0.65);   // ななめ うえ ほうこうへ
          b.vx=Math.cos(ang)*SPEED_SEMI*(Math.random()<0.5?-1:1)*-1;
          b.vy=Math.sin(ang)*SPEED_SEMI;
          if(b.perch){b.perch.taken=false;b.perch=null;}
          sfx('escape'); spawnPop(b.x,b.y,'💨 にげられた','rgba(255,255,255,0.7)');
        }
      }else if(b.state==='away'){
        b.x+=b.vx*dt; b.y+=b.vy*dt;
        if(b.x<-60||b.x>W+60||b.y<-60){ removeBug(b); continue; }
      }
      if(b.state!=='away'&&catchCD<=0&&inNet(b,-2)) doCatch(b);
    }
    else if(b.mode==='koro'){
      // とんぼの 1.5ばい の はやさで はねる → ときどき とまって なく
      if(b.state==='dash'){
        b.hop+=dt*16;
        b.wait-=dt;
        if(b.fleeCD>0) b.fleeCD-=dt;
        const d=netDist(b);
        if(d<140&&(b.fleeCD||0)<=0){ // あみが きたら いっきに にげる
          const a=Math.atan2(b.y-net.y,b.x-net.x);
          b.vx=Math.cos(a)*SPEED_KORO; b.vy=Math.sin(a)*SPEED_KORO;
          b.fleeCD=0.7;
        }
        b.x+=b.vx*dt; b.y+=b.vy*dt;
        if(b.x<45||b.x>W-45) b.vx*=-1;
        if(b.y<H*0.50||b.y>H*0.87) b.vy*=-1;
        b.x=Math.max(42,Math.min(W-42,b.x));
        b.y=Math.max(H*0.49,Math.min(H*0.88,b.y));
        b.dir=b.vx>=0?1:-1;
        if(b.wait<=0){ b.state='stop'; b.rest=RND(1.3,2.1); b.hop=0; sfx('chirp'); }
      }else{ // stop：ないている（つかまえられる）
        b.rest-=dt;
        if(catchCD<=0&&inNet(b,-2)){ doCatch(b); continue; }
        if(b.rest<=0){
          b.state='dash'; b.wait=RND(0.4,1.0); b.fleeCD=0.3; koroDir(b);
        }
      }
    }
    else if(b.mode==='sap'){
      // あみが ちかづくと ゆっくり にげる（とんぼの 1/4 の はやさ）
      const d=netDist(b);
      if(d<170&&d>0.5){
        const a=Math.atan2(b.y-net.y,b.x-net.x);
        let mx=Math.cos(a)*SPEED_KUWA*dt, my=Math.sin(a)*SPEED_KUWA*dt;
        const tr=trees[0];
        if(tr){
          const half=Math.max(20,tr.w/2-16), minx=tr.x-half, maxx=tr.x+half;
          // みきの はしに ついたら たて（うえ・した）に にげる
          if(b.x+mx<minx||b.x+mx>maxx){
            const dir = Math.abs(my)>0.001 ? Math.sign(my) : (b.y<H*0.5?1:-1);
            my = dir*SPEED_KUWA*dt;
            mx = Math.max(minx-b.x,Math.min(maxx-b.x,mx));
          }
          b.x=Math.max(minx,Math.min(maxx,b.x+mx));
        } else b.x+=mx;
        b.y=Math.max(H*0.20,Math.min(H*0.82,b.y+my));
        b.walk=(b.walk||0)+dt*6;
      }
      // あみを かぶせたまま すこし まつ
      if(catchCD<=0&&inNet(b,-2)){
        b.hold+=dt;
        if(Math.floor(b.hold*6)!==Math.floor((b.hold-dt)*6)) sfx('hold');
        if(b.hold>=0.9) doCatch(b);
      }else if(b.hold>0){ b.hold=Math.max(0,b.hold-dt*1.6); }
    }
  }
  bugs=bugs.filter(b=>b.alive);
  if(bugs.length<3&&Math.random()<dt*0.9) spawnBug();
}

/* ===== つかまえた ===== */
function doCatch(b){
  const s=b.s;
  const mm=Math.round(RND(s.mm[0],s.mm[1]));
  const isNew=!zukan[b.key];
  if(!zukan[b.key]) zukan[b.key]={count:0,best:0};
  zukan[b.key].count++;
  const isBest=mm>zukan[b.key].best;
  if(isBest) zukan[b.key].best=mm;
  save();
  caught++; updateCount(); catchCD=0.35; net.swing=1;
  spawnPop(b.x,b.y,`${s.n} ${mm}mm！${isBest&&!isNew?' 🏅さいこう':''}`, s.rare>=2?'#ffe66d':'#fff');
  if(s.rare>=2||isNew){ sfx('rare'); confetti(); } else sfx('catch');
  if(isNew) showNew(s.n);
  removeBug(b);
  if(caught>=STAGES[stageIdx].target) setTimeout(stageClear,700);
}
function showNew(name){
  const n=el('newBanner'); n.classList.remove('hidden');
  n.innerHTML=`<div>🆕 はつゲット！ ${name}</div>`;
  setTimeout(()=>n.classList.add('hidden'),1800);
}
function stageClear(){
  if(scene!=='play') return;
  scene='clear'; stop(); hideAll(); sfx('clear'); confetti();
  const next=stageIdx+1, first=!cleared[stageIdx];
  cleared[stageIdx]=true; save();
  const got=ORDER.filter(k=>zukan[k]).length;
  el('clEmoji').textContent=next<STAGES.length?'🎉':'🏆';
  el('clTitle').textContent=next<STAGES.length?`${STAGES[stageIdx].n} クリア！`:'ぜんぶの ばしょを クリア！';
  el('clNote').textContent=`🧺 ${STAGES[stageIdx].target}ひき つかまえた！\n📖 ずかん ${got} / ${ORDER.length} しゅるい`
    +(next<STAGES.length?`\n\nつぎは ${STAGES[next].n} だよ！`:'\n\nずかんを ぜんぶ あつめよう！');
  el('clBtns').innerHTML=
    (next<STAGES.length?`<button class="btn-green" onclick="startStage(${next})">▶ つぎの ばしょへ！</button>`:'')+
    `<button class="btn-gray" onclick="openZukan('stage')">📖 ずかん</button>`+
    `<button class="btn-gray" onclick="showStageSelect()">🗺 ばしょをえらぶ</button>`;
  el('clearScreen').classList.remove('hidden');
}
function spawnPop(x,y,txt,color){
  const d=document.createElement('div'); d.className='pop-text'; d.textContent=txt;
  d.style.left=(x/canvas.width*100)+'%'; d.style.top=(Math.max(60,y-20)/canvas.height*100)+'%';
  d.style.color=color||'#fff'; wrapper.appendChild(d); setTimeout(()=>d.remove(),1100);
}
function confetti(){
  const cs=['#ffe66d','#ff6b6b','#4ecdc4','#a8e6cf','#90e0ef','#c8f060'];
  for(let i=0;i<36;i++){ const d=document.createElement('div'); d.className='confetti';
    d.style.left=Math.random()*100+'%'; d.style.background=cs[i%cs.length];
    d.style.animationDuration=(1.5+Math.random()*2)+'s'; d.style.animationDelay=Math.random()*0.4+'s';
    d.style.borderRadius=Math.random()>0.5?'50%':'2px';
    wrapper.appendChild(d); setTimeout(()=>d.remove(),3800); }
}

/* ===== えがく ===== */
function render(){
  const W=canvas.width,H=canvas.height,th=STAGES[stageIdx].theme;
  ctx.clearRect(0,0,W,H);
  drawBG(th,W,H);
  // むし
  for(const b of bugs){
    ctx.save();
    const hopY=(b.mode==='koro'&&b.state==='dash')?-Math.abs(Math.sin(b.hop))*11:0;
    ctx.translate(b.x,b.y+hopY);
    if(b.dir===-1) ctx.scale(-1,1);
    drawBug(ctx,b.s,0,0,b);
    ctx.restore();
    if(b.mode==='sap'&&b.hold>0){
      ctx.save(); ctx.strokeStyle='#ffe66d'; ctx.lineWidth=5; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(b.x,b.y,38,-Math.PI/2,-Math.PI/2+Math.PI*2*(b.hold/0.9)); ctx.stroke();
      ctx.restore();
    }
    if(b.mode==='koro'&&b.state==='stop'){
      ctx.save(); ctx.globalAlpha=0.55+0.45*Math.sin(time*7);
      ctx.fillStyle='#ffe66d'; ctx.font='900 20px Nunito,sans-serif'; ctx.textAlign='center';
      ctx.fillText('♪',b.x-16,b.y-26+Math.sin(time*4)*3);
      ctx.font='900 15px Nunito,sans-serif';
      ctx.fillText('♪',b.x+14,b.y-34+Math.sin(time*4+1.5)*3);
      ctx.restore();
    }
    if(b.mode==='semi'&&b.state==='alert'){
      ctx.save(); ctx.globalAlpha=0.5+0.5*Math.sin(time*22);
      ctx.fillStyle='#ff6b6b'; ctx.font='900 20px Nunito,sans-serif'; ctx.textAlign='center';
      ctx.fillText('ジジジ…',b.x,b.y-34);
      ctx.strokeStyle='#ff6b6b'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(b.x,b.y,34,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-b.alert/1.35)); ctx.stroke();
      ctx.restore();
    }
  }
  drawNet();
}

function drawBG(th,W,H){
  if(th==='field'){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#a8e0ff'); g.addColorStop(0.55,'#d9f2c9'); g.addColorStop(1,'#8ec552');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.globalAlpha=0.85; ctx.fillStyle='#fff';
    [[W*0.18,H*0.13,34],[W*0.62,H*0.09,26],[W*0.82,H*0.18,20]].forEach(([x,y,r])=>{
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.arc(x+r*0.8,y+4,r*0.7,0,7); ctx.arc(x-r*0.8,y+5,r*0.6,0,7); ctx.fill(); });
    ctx.restore();
    ctx.fillStyle='#7ab648'; ctx.beginPath(); ctx.moveTo(0,H*0.62);
    for(let x=0;x<=W;x+=24) ctx.lineTo(x,H*0.62+Math.sin(x*0.02)*10);
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
    ctx.save(); ctx.strokeStyle='#5f9c36'; ctx.lineWidth=4; ctx.lineCap='round';
    for(let x=6;x<W;x+=26){ const s=Math.sin(time*1.4+x)*6;
      ctx.beginPath(); ctx.moveTo(x,H); ctx.quadraticCurveTo(x+s,H-40,x+s*2,H-72); ctx.stroke(); }
    ctx.restore();
    deco.forEach(d=>{ ctx.fillStyle=d.c;
      for(let i=0;i<5;i++){ const a=i/5*6.28; ctx.beginPath();
        ctx.ellipse(d.x+Math.cos(a)*d.r,d.y+Math.sin(a)*d.r,d.r*0.7,d.r*0.7,0,0,7); ctx.fill(); }
      ctx.fillStyle='#ffd54f'; ctx.beginPath(); ctx.arc(d.x,d.y,d.r*0.6,0,7); ctx.fill(); });
  }
  else if(th==='pond'){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#7fd1ff'); g.addColorStop(0.5,'#bfeaff'); g.addColorStop(0.72,'#79c7a8'); g.addColorStop(1,'#2e7f9e');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.globalAlpha=0.25; ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    for(let i=0;i<6;i++){ const y=H*0.78+i*16; ctx.beginPath();
      for(let x=0;x<=W;x+=10) x===0?ctx.moveTo(x,y+Math.sin(x*0.04+time*1.5+i)*3):ctx.lineTo(x,y+Math.sin(x*0.04+time*1.5+i)*3);
      ctx.stroke(); }
    ctx.restore();
    deco.forEach(d=>{ ctx.fillStyle='#3d9b63'; ctx.beginPath(); ctx.ellipse(d.x,d.y,d.r,d.r*0.55,0,0,7); ctx.fill();
      ctx.fillStyle='#2e7d4f'; ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x+d.r*0.9,d.y-d.r*0.2); ctx.lineTo(d.x+d.r*0.9,d.y+d.r*0.2); ctx.fill(); });
    // あし（とまり木）
    perches.forEach(p=>{ const s=Math.sin(time*1.2+p.x)*5;
      ctx.save(); ctx.strokeStyle='#5f9c36'; ctx.lineWidth=6; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(p.x-s*2,H*0.92); ctx.quadraticCurveTo(p.x-s,(H*0.92+p.y)/2,p.x,p.y+6); ctx.stroke();
      ctx.fillStyle='#8d6e3a'; ctx.beginPath(); ctx.ellipse(p.x,p.y,5,10,0,0,7); ctx.fill(); ctx.restore(); });
  }
  else if(th==='forest'){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#ff9e5e'); g.addColorStop(0.45,'#ffc48c'); g.addColorStop(1,'#3f5b2e');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.globalAlpha=0.9; ctx.fillStyle='#ffd88f';
    ctx.beginPath(); ctx.arc(W*0.8,H*0.16,30,0,7); ctx.fill(); ctx.restore();
    trees.forEach(t=>{
      const tg=ctx.createLinearGradient(t.x-t.w/2,0,t.x+t.w/2,0);
      tg.addColorStop(0,'#4a3520'); tg.addColorStop(0.4,'#6d5136'); tg.addColorStop(1,'#3a2818');
      ctx.fillStyle=tg; ctx.fillRect(t.x-t.w/2,0,t.w,H);
      ctx.save(); ctx.globalAlpha=0.25; ctx.strokeStyle='#2b1d10'; ctx.lineWidth=3;
      for(let i=0;i<5;i++){ const x=t.x-t.w/2+8+i*(t.w-16)/4; ctx.beginPath();
        for(let y=0;y<H;y+=26) y===0?ctx.moveTo(x,y):ctx.lineTo(x+Math.sin(y*0.05+i)*3,y);
        ctx.stroke(); } ctx.restore();
    });
    ctx.save(); ctx.globalAlpha=0.5; ctx.fillStyle='#2f4a22';
    for(let i=0;i<16;i++){ const x=(i*127)%W, y=(i*83)%(H*0.3);
      ctx.beginPath(); ctx.ellipse(x,y,26,14,i*0.7,0,7); ctx.fill(); } ctx.restore();
    ctx.fillStyle='#33471f'; ctx.fillRect(0,H*0.9,W,H*0.1);
  }
  else if(th==='grass'){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0a1230'); g.addColorStop(0.42,'#182a4e'); g.addColorStop(0.62,'#1e3a2a'); g.addColorStop(1,'#0f2416');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // ほし・つき
    ctx.save();
    for(let i=0;i<40;i++){ ctx.globalAlpha=0.3+0.4*Math.abs(Math.sin(time*0.9+i));
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc((i*151)%W,(i*67)%(H*0.42),1+(i%3)*0.6,0,7); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle='#fff8d8'; ctx.beginPath(); ctx.arc(W*0.80,H*0.15,24,0,7); ctx.fill();
    ctx.fillStyle='#182a4e'; ctx.beginPath(); ctx.arc(W*0.86,H*0.13,20,0,7); ctx.fill();
    // おくの くさ（シルエット）
    ctx.save(); ctx.globalAlpha=0.55; ctx.strokeStyle='#16351f'; ctx.lineWidth=7; ctx.lineCap='round';
    for(let x=-10;x<W+10;x+=22){ const sw=Math.sin(time*0.9+x*0.05)*10;
      ctx.beginPath(); ctx.moveTo(x,H*0.98); ctx.quadraticCurveTo(x+sw*0.5,H*0.72,x+sw,H*0.46); ctx.stroke(); }
    ctx.restore();
    // まえの くさ
    ctx.save(); ctx.strokeStyle='#2c5d33'; ctx.lineWidth=6; ctx.lineCap='round';
    for(let x=4;x<W;x+=30){ const sw=Math.sin(time*1.3+x*0.06)*12;
      ctx.beginPath(); ctx.moveTo(x,H); ctx.quadraticCurveTo(x+sw*0.5,H*0.82,x+sw,H*0.60); ctx.stroke(); }
    ctx.restore();
    // ほたるのような ひかり
    ctx.save();
    for(let i=0;i<8;i++){ const px=(i*97+time*14)%W, py=H*0.5+Math.sin(time*0.8+i)*40;
      ctx.globalAlpha=0.10+0.10*Math.abs(Math.sin(time*1.6+i)); ctx.fillStyle='#d8f58a';
      ctx.beginPath(); ctx.arc(px,py,10,0,7); ctx.fill(); }
    ctx.restore();
  }
  else{
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0b1030'); g.addColorStop(0.6,'#16244a'); g.addColorStop(1,'#1d3324');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.save();
    for(let i=0;i<46;i++){ ctx.globalAlpha=0.35+0.4*Math.abs(Math.sin(time*0.8+i));
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc((i*137)%W,(i*71)%(H*0.55),1+(i%3)*0.6,0,7); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle='#fff8d8'; ctx.beginPath(); ctx.arc(W*0.82,H*0.12,26,0,7); ctx.fill();
    ctx.fillStyle='#16244a'; ctx.beginPath(); ctx.arc(W*0.88,H*0.10,22,0,7); ctx.fill();
    const t=trees[0];
    if(t){
      const tg=ctx.createLinearGradient(t.x-t.w/2,0,t.x+t.w/2,0);
      tg.addColorStop(0,'#2a1c0e'); tg.addColorStop(0.42,'#4d3720'); tg.addColorStop(1,'#1e1409');
      ctx.fillStyle=tg; ctx.fillRect(t.x-t.w/2,0,t.w,H);
      ctx.save(); ctx.globalAlpha=0.3; ctx.strokeStyle='#150d05'; ctx.lineWidth=3;
      for(let i=0;i<6;i++){ const x=t.x-t.w/2+10+i*(t.w-20)/5; ctx.beginPath();
        for(let y=0;y<H;y+=24) y===0?ctx.moveTo(x,y):ctx.lineTo(x+Math.sin(y*0.045+i)*3,y);
        ctx.stroke(); } ctx.restore();
    }
    // じゅえき
    perches.forEach(p=>{ ctx.save();
      ctx.globalAlpha=0.85; ctx.fillStyle='#7b4a12';
      ctx.beginPath(); ctx.ellipse(p.x,p.y+10,30,16,0,0,7); ctx.fill();
      ctx.globalAlpha=0.5; ctx.fillStyle='#c98b2a';
      ctx.beginPath(); ctx.ellipse(p.x,p.y+8,18,9,0,0,7); ctx.fill(); ctx.restore(); });
    ctx.fillStyle='#1b2a17'; ctx.fillRect(0,H*0.92,W,H*0.08);
  }
}

function drawNet(){
  const x=net.x,y=net.y;
  const sw=Math.max(0,net.swing);
  ctx.save(); ctx.translate(x,y); ctx.rotate(sw*0.12); ctx.scale(netScale,netScale);
  // え（ぼう）
  ctx.strokeStyle='#a9762f'; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,NET_RY0-4); ctx.lineTo(0,-NET_DY+10); ctx.stroke();
  ctx.strokeStyle='#8a5d21'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(0,NET_RY0-4); ctx.lineTo(0,-NET_DY+10); ctx.stroke();
  // あみ（ふくろ）
  ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.ellipse(0,0,NET_RX0-3,NET_RY0-3,0,0,7); ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalAlpha=0.55; ctx.strokeStyle='#fff'; ctx.lineWidth=1.4;
  for(let i=-3;i<=3;i++){ const px=i*12;
    ctx.beginPath(); ctx.moveTo(px,-Math.sqrt(Math.max(0,1-(px/NET_RX0)**2))*NET_RY0);
    ctx.lineTo(px, Math.sqrt(Math.max(0,1-(px/NET_RX0)**2))*NET_RY0); ctx.stroke(); }
  for(let i=-2;i<=2;i++){ const py=i*13;
    const w=Math.sqrt(Math.max(0,1-(py/NET_RY0)**2))*NET_RX0;
    ctx.beginPath(); ctx.moveTo(-w,py); ctx.lineTo(w,py); ctx.stroke(); }
  ctx.restore();
  // わく
  ctx.strokeStyle='#ffd166'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.ellipse(0,0,NET_RX0,NET_RY0,0,0,7); ctx.stroke();
  ctx.strokeStyle='#e0a800'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.ellipse(0,0,NET_RX0,NET_RY0,0,0,7); ctx.stroke();
  ctx.restore();
}

/* ===== むしの え ===== */
function drawBug(c,s,x,y,b){
  const anim=b?b.anim:0;
  c.save(); c.translate(x,y); c.scale(s.sc,s.sc);
  if(s.draw==='cho') drawCho(c,s,anim,b);
  else if(s.draw==='tonbo') drawTonbo(c,s,anim,b);
  else if(s.draw==='semi') drawSemi(c,s,anim,b);
  else if(s.draw==='kabu') drawKabu(c,s,anim);
  else if(s.draw==='kuwa') drawKuwa(c,s,anim);
  else if(s.draw==='kana') drawKana(c,s,anim);
  else if(s.draw==='koro') drawKoro(c,s,anim,b);
  c.restore();
}
/* ちょうちょ（うえから見た かたち・はばたく）*/
function drawCho(c,s,anim){
  const f=Math.abs(Math.sin(anim*0.75));       // 0=ひらいた 1=とじた
  const w=1-f*0.40;
  c.save();
  [-1,1].forEach(sd=>{
    c.save(); c.scale(sd*w*1.18,1.12);
    // うしろばね
    c.fillStyle=s.c2;
    c.beginPath(); c.moveTo(2,2); c.quadraticCurveTo(20,10,24,24); c.quadraticCurveTo(14,30,4,16); c.closePath(); c.fill();
    // まえばね
    c.fillStyle=s.c1;
    c.beginPath(); c.moveTo(2,-2); c.quadraticCurveTo(26,-24,30,-8); c.quadraticCurveTo(28,6,4,6); c.closePath(); c.fill();
    // もよう
    c.fillStyle=s.c3; c.globalAlpha=0.9;
    c.beginPath(); c.ellipse(19,-9,5,4,0.3,0,7); c.fill();
    c.beginPath(); c.ellipse(15,20,4,3,0,0,7); c.fill();
    c.globalAlpha=1;
    c.strokeStyle='rgba(0,0,0,0.18)'; c.lineWidth=1.2;
    c.beginPath(); c.moveTo(4,-1); c.quadraticCurveTo(20,-12,29,-8); c.stroke();
    c.restore();
  });
  c.restore();
  // からだ
  c.fillStyle='#3a2a1a';
  c.beginPath(); c.ellipse(0,4,4,15,0,0,7); c.fill();
  c.beginPath(); c.arc(0,-11,5,0,7); c.fill();
  c.strokeStyle='#3a2a1a'; c.lineWidth=1.6; c.lineCap='round';
  [-1,1].forEach(sd=>{ c.beginPath(); c.moveTo(sd*2,-14);
    c.quadraticCurveTo(sd*9,-24,sd*13,-21); c.stroke(); });
  c.fillStyle='#fff'; c.beginPath(); c.arc(3,-12,1.6,0,7); c.fill();
}
/* とんぼ（よこ長・はねは とうめい）*/
function drawTonbo(c,s,anim,b){
  const flying=!b||b.state==='fly'||b.state==='land';
  const f=flying?Math.sin(anim*1.6)*0.5:0;
  // はね
  c.save(); c.globalAlpha=0.42; c.fillStyle='#dff3ff'; c.strokeStyle='rgba(120,160,190,0.8)'; c.lineWidth=1;
  [[-6,-1],[6,1]].forEach(([ox,sd])=>{
    [-1,1].forEach(dy=>{
      c.save(); c.translate(ox,0); c.rotate(dy*(0.25+f*0.5));
      c.beginPath(); c.ellipse(0,dy*3,26,5.5,0,0,7); c.fill(); c.stroke(); c.restore();
    });
  });
  c.restore();
  // どうたい
  c.fillStyle=s.c2;
  c.beginPath(); c.ellipse(-4,0,12,7,0,0,7); c.fill();
  const g=c.createLinearGradient(0,0,46,0); g.addColorStop(0,s.c1); g.addColorStop(1,s.c2);
  c.fillStyle=g;
  c.beginPath(); c.moveTo(4,-4); c.lineTo(46,-2.4); c.lineTo(48,0); c.lineTo(46,2.4); c.lineTo(4,4); c.closePath(); c.fill();
  c.strokeStyle='rgba(0,0,0,0.25)'; c.lineWidth=1;
  for(let i=1;i<7;i++){ const px=6+i*5.5; c.beginPath(); c.moveTo(px,-3.6); c.lineTo(px,3.6); c.stroke(); }
  // あたま・め
  c.fillStyle=s.c2; c.beginPath(); c.arc(-16,0,9,0,7); c.fill();
  c.fillStyle='#2b3a45'; c.beginPath(); c.arc(-19,-4,5.6,0,7); c.fill();
  c.beginPath(); c.arc(-19,4,5.6,0,7); c.fill();
  c.fillStyle='#fff'; c.globalAlpha=0.75;
  c.beginPath(); c.arc(-21,-5,1.8,0,7); c.fill(); c.globalAlpha=1;
}
/* セミ（うえから・はねを たたんでいる）*/
function drawSemi(c,s,anim,b){
  const shake=(b&&b.state==='alert')?Math.sin(anim*10)*1.5:0;
  c.save(); c.translate(shake,0);
  // はね
  c.fillStyle=s.w||'rgba(200,220,230,0.5)';
  c.strokeStyle='rgba(60,60,60,0.35)'; c.lineWidth=1;
  [-1,1].forEach(sd=>{ c.save(); c.scale(1,sd);
    c.beginPath(); c.moveTo(-4,2); c.quadraticCurveTo(20,6,34,16); c.quadraticCurveTo(16,20,-6,10); c.closePath();
    c.fill(); c.stroke(); c.restore(); });
  // からだ
  const g=c.createLinearGradient(0,-10,0,12); g.addColorStop(0,s.c1); g.addColorStop(1,s.c2);
  c.fillStyle=g;
  c.beginPath(); c.moveTo(-14,-9); c.quadraticCurveTo(6,-11,22,-4); c.quadraticCurveTo(24,0,22,4);
  c.quadraticCurveTo(6,11,-14,9); c.quadraticCurveTo(-19,0,-14,-9); c.closePath(); c.fill();
  c.fillStyle=s.c2; c.globalAlpha=0.55;
  for(let i=0;i<3;i++){ c.beginPath(); c.ellipse(10+i*4,0,1.6,6-i,0,0,7); c.fill(); }
  c.globalAlpha=1;
  // あたま・め
  c.fillStyle=s.c2; c.beginPath(); c.ellipse(-17,0,7,9,0,0,7); c.fill();
  c.fillStyle='#141414'; c.beginPath(); c.arc(-19,-6,3.4,0,7); c.fill();
  c.beginPath(); c.arc(-19,6,3.4,0,7); c.fill();
  c.fillStyle='#fff'; c.beginPath(); c.arc(-20,-7,1.1,0,7); c.fill();
  // あし
  c.strokeStyle=s.c2; c.lineWidth=2; c.lineCap='round';
  [-1,1].forEach(sd=>{ for(let i=0;i<3;i++){ c.beginPath(); c.moveTo(-8+i*8,sd*7);
    c.lineTo(-12+i*8,sd*15); c.stroke(); } });
  c.restore();
}
/* カブトムシ（うえから・つの）*/
function drawKabu(c,s,anim){
  const lg=Math.sin(anim)*1.2;
  c.strokeStyle=s.c2; c.lineWidth=3.4; c.lineCap='round';
  [-1,1].forEach(sd=>{ for(let i=0;i<3;i++){ c.beginPath(); c.moveTo(-2+i*9,sd*11);
    c.quadraticCurveTo(-6+i*9,sd*18+lg,-12+i*9,sd*22+lg); c.stroke(); } });
  const g=c.createLinearGradient(0,-14,0,14); g.addColorStop(0,'#8a5a2c'); g.addColorStop(0.4,s.c1); g.addColorStop(1,s.c2);
  c.fillStyle=g;
  c.beginPath(); c.ellipse(6,0,24,15,0,0,7); c.fill();            // はねばね
  c.strokeStyle='rgba(0,0,0,0.4)'; c.lineWidth=1.6;
  c.beginPath(); c.moveTo(-14,0); c.lineTo(29,0); c.stroke();
  c.fillStyle=s.c2; c.beginPath(); c.ellipse(-15,0,11,12,0,0,7); c.fill();  // まえむね
  c.fillStyle='#241305'; c.beginPath(); c.ellipse(-26,0,7,8,0,0,7); c.fill(); // あたま
  // あたまの つの（Yがた・カブトムシの トレードマーク）
  c.fillStyle='#3a2009';
  c.beginPath();
  c.moveTo(-27,-7);
  c.bezierCurveTo(-42,-15,-52,-21,-60,-25);
  c.lineTo(-73,-33);            // うえの さきっぽ
  c.lineTo(-63,-21);
  c.lineTo(-74,-18);            // したの さきっぽ
  c.lineTo(-60,-18);
  c.bezierCurveTo(-50,-11,-38,-3,-25,3);
  c.closePath(); c.fill();
  c.strokeStyle='#201204'; c.lineWidth=1.4; c.stroke();
  // むねの つの（ちいさい）
  c.fillStyle='#2e1a09';
  c.beginPath(); c.moveTo(-17,4); c.quadraticCurveTo(-33,12,-44,18);
  c.quadraticCurveTo(-38,11,-30,7); c.quadraticCurveTo(-22,5,-15,8);
  c.closePath(); c.fill();
  c.save(); c.globalAlpha=0.16; c.fillStyle='#fff';
  c.beginPath(); c.ellipse(8,-6,11,3,-0.1,0,7); c.fill(); c.restore();
}
/* クワガタ（おおあご）*/
function drawKuwa(c,s,anim){
  const lg=Math.sin(anim)*1.2, op=0.12+0.1*Math.sin(anim*0.7);
  c.strokeStyle=s.c2; c.lineWidth=3.2; c.lineCap='round';
  [-1,1].forEach(sd=>{ for(let i=0;i<3;i++){ c.beginPath(); c.moveTo(-2+i*9,sd*10);
    c.quadraticCurveTo(-6+i*9,sd*17+lg,-12+i*9,sd*21+lg); c.stroke(); } });
  const g=c.createLinearGradient(0,-13,0,13); g.addColorStop(0,s.c1); g.addColorStop(1,s.c2);
  c.fillStyle=g;
  c.beginPath(); c.ellipse(8,0,23,13,0,0,7); c.fill();
  c.strokeStyle='rgba(0,0,0,0.45)'; c.lineWidth=1.6;
  c.beginPath(); c.moveTo(-12,0); c.lineTo(30,0); c.stroke();
  c.fillStyle=s.c2; c.beginPath(); c.roundRect(-24,-11,16,22,5); c.fill();  // まえむね
  c.fillStyle='#1b1b1b'; c.beginPath(); c.roundRect(-33,-8,10,16,4); c.fill(); // あたま
  // おおあご
  c.strokeStyle='#1b1b1b'; c.lineWidth=5; c.lineCap='round';
  [-1,1].forEach(sd=>{ c.save(); c.scale(1,sd); c.rotate(-op*0.15);
    c.beginPath(); c.moveTo(-33,-5); c.quadraticCurveTo(-48,-14,-60,-9); c.stroke();
    c.lineWidth=3.4; c.beginPath(); c.moveTo(-48,-11); c.lineTo(-46,-17); c.stroke();
    c.beginPath(); c.moveTo(-58,-9.6); c.lineTo(-62,-15); c.stroke();
    c.restore(); });
  c.save(); c.globalAlpha=0.17; c.fillStyle='#fff';
  c.beginPath(); c.ellipse(10,-5,10,3,-0.1,0,7); c.fill(); c.restore();
}
/* スズムシ・コオロギ（よこむき）*/
function drawKoro(c,s,anim,b){
  const chirp=b&&b.state==='stop';
  const w=s.wingW||1, leg=Math.sin(anim)*2;
  // しょっかく（とても ながい）
  c.strokeStyle=s.c2; c.lineWidth=1.9; c.lineCap='round';
  for(let i=0;i<2;i++){ const d=i?1:-1;
    c.beginPath(); c.moveTo(15,d*2);
    c.quadraticCurveTo(44,d*7-3,72,d*19-7+Math.sin(anim*0.5+i)*5); c.stroke(); }
  // うしろあし（ジャンプよう）
  [-1,1].forEach(sd=>{ c.save(); c.scale(1,sd);
    c.strokeStyle=s.c2; c.lineWidth=6.5; c.lineCap='round';
    c.beginPath(); c.moveTo(-6,3); c.quadraticCurveTo(-20,-9,-25,1); c.stroke();
    c.lineWidth=3;
    c.beginPath(); c.moveTo(-25,1); c.lineTo(-31,15+leg); c.stroke();
    c.restore(); });
  // まえあし
  c.strokeStyle=s.c2; c.lineWidth=2.6;
  [-1,1].forEach(sd=>{ for(let i=0;i<2;i++){
    c.beginPath(); c.moveTo(3+i*8,sd*6); c.lineTo(8+i*8,sd*14+leg*sd); c.stroke(); } });
  // からだ
  const g=c.createLinearGradient(0,-10,0,10); g.addColorStop(0,s.c1); g.addColorStop(1,s.c2);
  c.fillStyle=g; c.beginPath(); c.ellipse(-5,0,19,9,0,0,7); c.fill();
  // はね（なくときは すこし ひらく）
  const sp=chirp?1.4:1.0;
  [-1,1].forEach(sd=>{ c.save(); c.scale(1,sd);
    c.translate(0,0); c.rotate(chirp?sd*-0.0:0);
    c.fillStyle=s.c1; c.globalAlpha=0.95;
    c.beginPath(); c.moveTo(7,-1);
    c.quadraticCurveTo(-6,-12*w*sp,-21,-9*w*sp);
    c.quadraticCurveTo(-25,-2,-15,1); c.closePath(); c.fill();
    c.strokeStyle='rgba(0,0,0,0.3)'; c.lineWidth=1; c.stroke();
    c.globalAlpha=0.5; c.strokeStyle='rgba(0,0,0,0.25)';
    c.beginPath(); c.moveTo(2,-3); c.quadraticCurveTo(-9,-8*w*sp,-19,-6*w*sp); c.stroke();
    c.restore(); });
  // あたま
  c.globalAlpha=1; c.fillStyle=s.c2;
  c.beginPath(); c.ellipse(13,0,9,8,0,0,7); c.fill();
  c.fillStyle='#111'; c.beginPath(); c.arc(17,-4,2.9,0,7); c.fill();
  c.fillStyle='#fff'; c.beginPath(); c.arc(18,-5,1,0,7); c.fill();
}

/* カナブン */
function drawKana(c,s,anim){
  const lg=Math.sin(anim)*1.5;
  c.strokeStyle=s.c2; c.lineWidth=2.6; c.lineCap='round';
  [-1,1].forEach(sd=>{ for(let i=0;i<3;i++){ c.beginPath(); c.moveTo(-2+i*7,sd*8);
    c.lineTo(-7+i*7,sd*15+lg); c.stroke(); } });
  const g=c.createLinearGradient(0,-11,0,11); g.addColorStop(0,'#8fdc72'); g.addColorStop(0.5,s.c1); g.addColorStop(1,s.c2);
  c.fillStyle=g; c.beginPath(); c.ellipse(4,0,19,12,0,0,7); c.fill();
  c.strokeStyle='rgba(0,0,0,0.35)'; c.lineWidth=1.4;
  c.beginPath(); c.moveTo(-10,0); c.lineTo(22,0); c.stroke();
  c.fillStyle=s.c2; c.beginPath(); c.ellipse(-13,0,8,9,0,0,7); c.fill();
  c.fillStyle='#1e3b16'; c.beginPath(); c.ellipse(-21,0,5,6,0,0,7); c.fill();
  c.save(); c.globalAlpha=0.4; c.fillStyle='#fff';
  c.beginPath(); c.ellipse(4,-5,11,3,-0.1,0,7); c.fill(); c.restore();
}
