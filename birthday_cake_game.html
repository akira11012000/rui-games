<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RUIくんの たんじょうびケーキをつくろう！</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(160deg, #ff9de2 0%, #ffcf77 100%);
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ===== タイトル ===== */
  #title-bar {
    width: 100%;
    text-align: center;
    padding: 14px 8px 8px;
    font-size: clamp(18px, 5vw, 26px);
    font-weight: 900;
    color: #fff;
    text-shadow: 2px 2px 0 #e91e8c, 4px 4px 0 rgba(233,30,140,0.3);
    letter-spacing: 1px;
  }

  /* ===== ケーキエリア ===== */
  #cake-area {
    position: relative;
    width: min(340px, 90vw);
    height: min(340px, 90vw);
    margin: 4px auto 6px;
  }
  #cake-canvas {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    display: block;
  }

  /* ===== デコレーション選択パネル ===== */
  #deco-panel {
    width: min(380px, 96vw);
    background: rgba(255,255,255,0.85);
    border-radius: 20px;
    padding: 10px 6px 8px;
    margin: 0 auto 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  #deco-label {
    text-align: center;
    font-size: clamp(14px, 3.5vw, 18px);
    font-weight: 900;
    color: #e91e8c;
    margin-bottom: 8px;
  }
  #deco-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .deco-btn {
    width: 64px;
    height: 64px;
    font-size: 34px;
    border: 3px solid transparent;
    border-radius: 16px;
    background: #fff8fd;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(233,30,140,0.15);
  }
  .deco-btn.selected {
    border-color: #e91e8c;
    background: #ffe0f4;
    transform: scale(1.12);
  }
  .deco-btn:active { transform: scale(0.92); }

  /* ===== アクションボタン ===== */
  #action-area {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin: 4px auto;
  }
  .action-btn {
    padding: 14px 22px;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(16px, 4vw, 22px);
    font-weight: 900;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .action-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }
  #btn-clear { background: #ffb3de; color: #c2005a; }
  #btn-done  { background: #ff4da6; color: #fff; }

  /* ===== ろうそくフェーズ ===== */
  #candle-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100vh;
    position: fixed;
    top: 0; left: 0;
    background: linear-gradient(160deg, #1a0533 0%, #3d0070 100%);
    z-index: 50;
    justify-content: center;
    padding: 20px;
  }
  #candle-title {
    font-size: clamp(22px, 6vw, 36px);
    font-weight: 900;
    color: #ffe566;
    text-shadow: 0 0 20px #ffaa00;
    text-align: center;
    margin-bottom: 16px;
  }
  #candle-cake-wrap {
    position: relative;
    width: min(300px, 80vw);
    height: min(300px, 80vw);
  }
  #candle-cake-canvas { width: 100%; height: 100%; border-radius: 16px; }
  #blow-btn {
    margin-top: 24px;
    padding: 20px 48px;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(24px, 7vw, 40px);
    font-weight: 900;
    background: #ffe566;
    color: #7a3f00;
    border: none;
    border-radius: 50px;
    box-shadow: 0 6px 0 #c49000;
    cursor: pointer;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
  #blow-btn:active { transform: scale(0.93); }
  #candle-hint {
    margin-top: 12px;
    font-size: clamp(14px, 3.5vw, 20px);
    color: #e8b8ff;
    font-weight: 700;
  }

  /* ===== お祝い画面 ===== */
  #celebrate-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100vh;
    position: fixed;
    top: 0; left: 0;
    background: linear-gradient(135deg, #ff4da6 0%, #ffcf00 100%);
    z-index: 100;
    padding: 20px;
    text-align: center;
  }
  #celebrate-title {
    font-size: clamp(28px, 9vw, 56px);
    font-weight: 900;
    color: #fff;
    text-shadow: 3px 3px 0 #e91e8c, 6px 6px 0 rgba(0,0,0,0.15);
    line-height: 1.2;
    margin-bottom: 16px;
    animation: titleBounce 0.6s ease-out;
  }
  @keyframes titleBounce {
    0%   { transform: scale(0.3); opacity: 0; }
    70%  { transform: scale(1.12); }
    100% { transform: scale(1);   opacity: 1; }
  }
  #celebrate-cake {
    width: min(220px, 60vw);
    height: min(220px, 60vw);
    margin: 8px auto;
    border-radius: 16px;
  }
  #celebrate-sub {
    font-size: clamp(18px, 5vw, 30px);
    color: #fff;
    font-weight: 900;
    margin-bottom: 24px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
  }
  #replay-btn {
    padding: 18px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(20px, 5.5vw, 30px);
    font-weight: 900;
    background: #fff;
    color: #e91e8c;
    border: none;
    border-radius: 50px;
    box-shadow: 0 6px 0 #c2005a;
    cursor: pointer;
  }
  #replay-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c2005a; }

  /* ===== 紙吹雪 ===== */
  .confetti-piece {
    position: fixed;
    width: 12px;
    height: 18px;
    border-radius: 3px;
    opacity: 0;
    z-index: 200;
    pointer-events: none;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }
</style>
</head>
<body>

<!-- ===== メインゲーム画面 ===== -->
<div id="title-bar">🎂 RUIくんの たんじょうびケーキ！</div>

<div id="cake-area">
  <canvas id="cake-canvas"></canvas>
</div>

<div id="deco-panel">
  <div id="deco-label">🎨 すきなかざりを えらんでね！</div>
  <div id="deco-grid">
    <button class="deco-btn" data-deco="🍓" ontouchstart="selectDeco(this)" onclick="selectDeco(this)">🍓</button>
    <button class="deco-btn" data-deco="🫐" ontouchstart="selectDeco(this)" onclick="selectDeco(this)">🫐</button>
    <button class="deco-btn" data-deco="🍒" ontouchstart="selectDeco(this)" onclick="selectDeco(this)">🍒</button>
    <button class="deco-btn" data-deco="⭐" ontouchstart="selectDeco(this)" onclick="selectDeco(this)">⭐</button>
    <button class="deco-btn" data-deco="🌸" ontouchstart="selectDeco(this)" onclick="selectDeco(this)">🌸</button>
    <button class="deco-btn" data-deco="🍭" ontouchstart="selectDeco(this)" onclick="selectDeco(this)">🍭</button>
    <button class="deco-btn" data-deco="🎀" ontouchstart="selectDeco(this)" onclick="selectDeco(this)">🎀</button>
    <button class="deco-btn" data-deco="💎" ontouchstart="selectDeco(this)" onclick="selectDeco(this)">💎</button>
    <button class="deco-btn" data-deco="🌈" ontouchstart="selectDeco(this)" onclick="selectDeco(this)">🌈</button>
  </div>
</div>

<div id="action-area">
  <button class="action-btn" id="btn-clear" ontouchstart="clearDecos()" onclick="clearDecos()">🔄 やりなおし</button>
  <button class="action-btn" id="btn-done"  ontouchstart="doneDeco()" onclick="doneDeco()">🎂 できた！</button>
</div>

<!-- ===== ろうそくフェーズ ===== -->
<div id="candle-screen">
  <div id="candle-title">🕯️ ろうそくを ふーっと<br>けそう！</div>
  <div id="candle-cake-wrap">
    <canvas id="candle-cake-canvas"></canvas>
  </div>
  <button id="blow-btn" ontouchstart="blowCandles()" onclick="blowCandles()">ふーっ！ 💨</button>
  <div id="candle-hint">ボタンをおして ろうそくを けしてね</div>
</div>

<!-- ===== お祝い画面 ===== -->
<div id="celebrate-screen">
  <div id="celebrate-title">🎉 おたんじょうび<br>おめでとう！🎉</div>
  <canvas id="celebrate-cake"></canvas>
  <div id="celebrate-sub">🥳 RUIくん おめでとう！🎈</div>
  <button id="replay-btn" ontouchstart="replayGame()" onclick="replayGame()">🎂 もういちど あそぶ</button>
</div>

<script>
// ============================
//  設定
// ============================
const CAKE_LAYERS = [
  { color: '#f9e4b7', stroke: '#e8c87a' },  // 下段
  { color: '#ffb3de', stroke: '#e91e8c' },  // 中段
  { color: '#fff0f8', stroke: '#ffb3de' },  // 上段
];
const CREAM_COLOR   = '#fff8e7';
const PLATE_COLOR   = '#e8e0ff';
const CANDLE_COLORS = ['#ff4da6','#ffcf00','#4dc8ff','#b0f542','#ff8c42'];

let selectedDeco  = '🍓';
let placedDecos   = [];   // {emoji, x, y, size}
let candlesLit    = true; // ろうそく点灯中か

// ============================
//  Canvas セットアップ
// ============================
function setupCanvas(canvas) {
  const size = canvas.offsetWidth || 300;
  canvas.width  = size * window.devicePixelRatio;
  canvas.height = size * window.devicePixelRatio;
  const ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  return { ctx, size };
}

// ============================
//  ケーキ描画（メイン）
// ============================
function drawCake(canvas, opts = {}) {
  const { ctx, size: S } = setupCanvas(canvas);
  const showCandles  = opts.showCandles  !== false;
  const litCandles   = opts.litCandles   !== false;
  const decos        = opts.decos        || placedDecos;
  const showDecos    = opts.showDecos    !== false;
  ctx.clearRect(0, 0, S, S);

  // --- お皿 ---
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(S/2, S*0.88, S*0.42, S*0.07, 0, 0, Math.PI*2);
  ctx.fillStyle = PLATE_COLOR;
  ctx.fill();
  ctx.restore();

  // --- 下段 ---
  drawLayer(ctx, S, S*0.55, S*0.38, S*0.22, CAKE_LAYERS[0]);
  // --- 中段 ---
  drawLayer(ctx, S, S*0.38, S*0.28, S*0.17, CAKE_LAYERS[1]);
  // --- 上段 ---
  drawLayer(ctx, S, S*0.24, S*0.18, S*0.13, CAKE_LAYERS[2]);

  // --- クリーム ---
  drawCream(ctx, S);

  // --- ろうそく ---
  if (showCandles) {
    drawCandles(ctx, S, litCandles);
  }

  // --- デコレーション ---
  if (showDecos && decos.length > 0) {
    decos.forEach(d => {
      ctx.font = `${d.size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(d.emoji, d.x, d.y);
    });
  }
}

function drawLayer(ctx, S, cy, rx, ry, col) {
  // 側面
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(S/2, cy + ry*0.7, rx, ry*0.4, 0, 0, Math.PI*2);
  ctx.fillStyle = shadeColor(col.color, -15);
  ctx.fill();
  ctx.restore();

  // 上面
  ctx.save();
  const grad = ctx.createRadialGradient(S/2, cy-ry*0.15, 0, S/2, cy, rx);
  grad.addColorStop(0, lightenColor(col.color, 30));
  grad.addColorStop(1, col.color);
  ctx.beginPath();
  ctx.ellipse(S/2, cy, rx, ry, 0, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.strokeStyle = col.stroke;
  ctx.lineWidth = 2;
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawCream(ctx, S) {
  const blobs = [
    {x: S*0.26, y: S*0.52},
    {x: S*0.50, y: S*0.49},
    {x: S*0.74, y: S*0.52},
    {x: S*0.36, y: S*0.34},
    {x: S*0.64, y: S*0.34},
    {x: S*0.50, y: S*0.22},
  ];
  blobs.forEach(b => {
    ctx.save();
    ctx.beginPath();
    // 下の丸
    ctx.arc(b.x, b.y + 6, 9, 0, Math.PI*2);
    ctx.fillStyle = CREAM_COLOR;
    ctx.fill();
    // 上の丸
    ctx.beginPath();
    ctx.arc(b.x, b.y - 4, 7, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    // 先端
    ctx.beginPath();
    ctx.arc(b.x, b.y - 12, 4, 0, Math.PI*2);
    ctx.fillStyle = '#fff8f0';
    ctx.fill();
    ctx.restore();
  });
}

function drawCandles(ctx, S, lit) {
  const positions = [
    { x: S*0.32, base: S*0.235 },  // 1本目（左端）
    { x: S*0.41, base: S*0.205 },  // 2本目
    { x: S*0.50, base: S*0.185 },  // 3本目（中央・最高）
    { x: S*0.59, base: S*0.205 },  // 4本目
    { x: S*0.68, base: S*0.235 },  // 5本目（右端）
  ];
  positions.forEach((p, i) => {
    const col = CANDLE_COLORS[i % CANDLE_COLORS.length];
    const cx  = p.x;
    const by  = p.base;
    const w   = S * 0.036;  // 5本に合わせてやや細く
    const h   = S * 0.13;

    // ろうそく本体
    ctx.save();
    const cg = ctx.createLinearGradient(cx-w, 0, cx+w, 0);
    cg.addColorStop(0, shadeColor(col, -20));
    cg.addColorStop(0.5, lightenColor(col, 30));
    cg.addColorStop(1, shadeColor(col, -10));
    ctx.beginPath();
    ctx.roundRect(cx - w/2, by - h, w, h, [w/2, w/2, 4, 4]);
    ctx.fillStyle = cg;
    ctx.fill();
    // ろうのたれ
    ctx.beginPath();
    ctx.ellipse(cx, by - h + 2, w/2, 3, 0, 0, Math.PI*2);
    ctx.fillStyle = '#fff9e0';
    ctx.fill();
    ctx.restore();

    // 炎
    if (lit) {
      drawFlame(ctx, cx, by - h - 2, S * 0.05);
    }
  });
}

function drawFlame(ctx, x, y, r) {
  ctx.save();
  // 外側炎
  ctx.beginPath();
  ctx.moveTo(x, y - r*2.2);
  ctx.bezierCurveTo(x + r*1.1, y - r, x + r*0.8, y + r*0.3, x, y + r*0.5);
  ctx.bezierCurveTo(x - r*0.8, y + r*0.3, x - r*1.1, y - r, x, y - r*2.2);
  const fg1 = ctx.createRadialGradient(x, y, 0, x, y - r, r*2.5);
  fg1.addColorStop(0, 'rgba(255,255,200,1)');
  fg1.addColorStop(0.4, 'rgba(255,200,0,0.95)');
  fg1.addColorStop(1, 'rgba(255,80,0,0)');
  ctx.fillStyle = fg1;
  ctx.fill();
  // 内炎
  ctx.beginPath();
  ctx.moveTo(x, y - r*1.3);
  ctx.bezierCurveTo(x + r*0.5, y - r*0.4, x + r*0.4, y + r*0.2, x, y + r*0.3);
  ctx.bezierCurveTo(x - r*0.4, y + r*0.2, x - r*0.5, y - r*0.4, x, y - r*1.3);
  ctx.fillStyle = 'rgba(255,255,220,0.85)';
  ctx.fill();
  ctx.restore();
}

// ============================
//  デコレーション選択
// ============================
function selectDeco(btn) {
  document.querySelectorAll('.deco-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedDeco = btn.dataset.deco;
}

// ============================
//  タップでデコレーション配置
// ============================
const cakeCanvas = document.getElementById('cake-canvas');

function getCanvasPos(e) {
  const rect = cakeCanvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  return {
    x: touch.clientX - rect.left,
    y: touch.clientY - rect.top,
  };
}

function placeDeco(e) {
  e.preventDefault();
  if (!selectedDeco) return;
  const { x, y } = getCanvasPos(e);
  // ケーキ領域内かざっくり判定
  const S = cakeCanvas.offsetWidth;
  if (x < S*0.05 || x > S*0.95 || y < S*0.05 || y > S*0.88) return;
  placedDecos.push({ emoji: selectedDeco, x, y, size: Math.round(S * 0.13) });
  drawCake(cakeCanvas);
}

cakeCanvas.addEventListener('touchstart', placeDeco, { passive: false });
cakeCanvas.addEventListener('click',      placeDeco);

// ============================
//  クリア・完成ボタン
// ============================
function clearDecos() {
  placedDecos = [];
  drawCake(cakeCanvas);
}

function doneDeco() {
  if (placedDecos.length === 0) {
    // デコなしでも進める
  }
  // ろうそく画面へ
  candlesLit = true;
  const cs = document.getElementById('candle-screen');
  cs.style.display = 'flex';
  const cc = document.getElementById('candle-cake-canvas');
  drawCake(cc, { decos: placedDecos, showCandles: true, litCandles: true });
}

// ============================
//  ろうそくを消す
// ============================
function blowCandles() {
  if (!candlesLit) return;
  candlesLit = false;
  const cc = document.getElementById('candle-cake-canvas');
  // アニメ：炎が消えるようにちらつかせる
  let cnt = 0;
  const flicker = setInterval(() => {
    drawCake(cc, { decos: placedDecos, showCandles: true, litCandles: cnt % 2 === 0 });
    cnt++;
    if (cnt >= 8) {
      clearInterval(flicker);
      drawCake(cc, { decos: placedDecos, showCandles: true, litCandles: false });
      setTimeout(showCelebrate, 600);
    }
  }, 100);
}

// ============================
//  お祝い画面
// ============================
function showCelebrate() {
  document.getElementById('candle-screen').style.display = 'none';
  const cel = document.getElementById('celebrate-screen');
  cel.style.display = 'flex';
  const cc2 = document.getElementById('celebrate-cake');
  drawCake(cc2, { decos: placedDecos, showCandles: true, litCandles: false });
  launchConfetti();
  playHappyBirthday();   // 🎵 歌声スタート！
}

function replayGame() {
  placedDecos = [];
  candlesLit  = true;
  document.getElementById('celebrate-screen').style.display = 'none';
  document.getElementById('candle-screen').style.display    = 'none';
  drawCake(cakeCanvas);
}

// ============================
//  🎵 Happy Birthday 女性やさしい歌声（フォルマント合成）
// ============================

// ★ グローバルで保持：GC（ガベージコレクション）による途切れを防ぐ
let _audioCtx = null;
// 全ノードを配列で保持して、GCで解放されないようにする
let _audioNodes = [];

function playHappyBirthday() {
  try {
    // AudioContext を再利用・生成
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!_audioCtx || _audioCtx.state === 'closed') {
      _audioCtx = new AC();
    }
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    _audioNodes = []; // ノード参照リセット

    // 女性の声域：長3度（4半音）上げる
    const TR = Math.pow(2, 4 / 12);
    const F = {
      G4: 392.00 * TR, A4: 440.00 * TR, B4: 493.88 * TR,
      C5: 523.25 * TR, D5: 587.33 * TR, E5: 659.25 * TR,
      F5: 698.46 * TR, G5: 783.99 * TR,
    };

    const BPM  = 80;
    const BEAT = 60 / BPM;

    const melody = [
      ['G4',0.75],['G4',0.25],['A4',1],['G4',1],['C5',1],['B4',2],
      ['G4',0.75],['G4',0.25],['A4',1],['G4',1],['D5',1],['C5',2],
      ['G4',0.75],['G4',0.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
      ['F5',0.75],['F5',0.25],['E5',1],['C5',1],['D5',1],['C5',3],
    ];

    // メロディー全体の長さ（秒）を計算して最後まで確実に再生
    const totalBeats = melody.reduce((s, [, b]) => s + b, 0);
    const totalSec   = totalBeats * BEAT + 1.5; // 余裕を持たせる

    let t = _audioCtx.currentTime + 0.2;
    melody.forEach(([name, beats]) => {
      const freq = F[name];
      const dur  = beats * BEAT;
      // 音の長さは拍の95%（隣接音が重なって滑らかに続く）
      singNote(_audioCtx, freq, t, dur * 0.95, 0.24);
      t += dur;
    });

    // totalSec 後に _audioNodes を解放
    setTimeout(() => { _audioNodes = []; }, totalSec * 1000 + 500);

  } catch(e) { /* 非対応環境は無音で続行 */ }
}

// -------------------------------------------------------
//  フォルマント合成：のこぎり波 → ウェーブシェイパー
//  → 女性"アー"フォルマントフィルター3本 → エンベロープ
// -------------------------------------------------------
function singNote(ctx, freq, start, duration, vol) {

  // ① 声帯源音（のこぎり波）
  const src = ctx.createOscillator();
  src.type = 'sawtooth';
  src.frequency.value = freq;

  // ② ウェーブシェイパー（やわらかくする）
  const shaper = ctx.createWaveShaper();
  const N = 512;
  const curve = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const x = (i * 2) / N - 1;
    curve[i] = (5 * x) / (5 + 3 * Math.abs(x)) * 0.55;
  }
  shaper.curve = curve;
  shaper.oversample = '4x';

  // ③ ビブラート（5.5Hz、±1.5%）
  const lfo     = ctx.createOscillator();
  const lfoGain = ctx.createGain();
  lfo.type = 'sine';
  lfo.frequency.value = 5.5;
  lfoGain.gain.value  = freq * 0.015;
  lfo.connect(lfoGain);
  lfoGain.connect(src.frequency);

  // ④ 女性「アー」フォルマント 3本
  const makeF = (hz, q, g) => {
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = hz; bp.Q.value = q;
    const gn = ctx.createGain(); gn.gain.value = g;
    return { bp, gn };
  };
  const fm1 = makeF(850,  4.5, 1.00);
  const fm2 = makeF(1200, 5.5, 0.55);
  const fm3 = makeF(2600, 7.0, 0.18);

  // ⑤ マスターゲイン
  const master = ctx.createGain();

  // 結線
  src.connect(shaper);
  [fm1, fm2, fm3].forEach(({ bp, gn }) => {
    shaper.connect(bp); bp.connect(gn); gn.connect(master);
  });
  master.connect(ctx.destination);

  // ⑥ エンベロープ
  master.gain.setValueAtTime(0,   start);
  master.gain.linearRampToValueAtTime(vol, start + 0.08);          // アタック
  master.gain.setValueAtTime(vol * 0.88, start + duration * 0.65); // サステイン
  master.gain.linearRampToValueAtTime(0,   start + duration);      // リリース

  // ⑦ 終了タイミング（duration より少し長めに設定して音切れを防ぐ）
  const stopAt = start + duration + 0.25;
  [src, lfo].forEach(o => { o.start(start); o.stop(stopAt); });

  // ★ ノード参照をグローバル配列に保持してGCを防ぐ
  _audioNodes.push(src, lfo, shaper, master,
    fm1.bp, fm1.gn, fm2.bp, fm2.gn, fm3.bp, fm3.gn, lfoGain);
}

// ============================
//  紙吹雪
// ============================
const CONFETTI_COLORS = ['#ff4da6','#ffcf00','#4dc8ff','#b0f542','#ff8c42','#e040fb','#fff'];
let _confettiTimer = null;

function launchConfetti() {
  // Happy Birthday の曲の長さ：26拍 × (60÷80BPM) + 余裕 ≒ 21秒
  const SONG_DURATION_MS = 21000;
  const INTERVAL_MS      = 180;   // 約180msごとに1枚ずつ出す

  // 既存のタイマーがあれば止める（replayのとき）
  if (_confettiTimer) {
    clearInterval(_confettiTimer);
    _confettiTimer = null;
  }

  // 冒頭だけ一気に出して華やかに演出
  for (let i = 0; i < 20; i++) {
    setTimeout(() => spawnConfetti(), i * 60);
  }

  // その後は曲が終わるまでコンスタントに降らせ続ける
  const startTime = Date.now();
  _confettiTimer = setInterval(() => {
    spawnConfetti();
    if (Date.now() - startTime >= SONG_DURATION_MS) {
      clearInterval(_confettiTimer);
      _confettiTimer = null;
    }
  }, INTERVAL_MS);
}

function spawnConfetti() {
  const el = document.createElement('div');
  el.className = 'confetti-piece';
  const col  = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
  const left = Math.random() * 100;
  const dur  = 1.8 + Math.random() * 1.6;
  const size = 8 + Math.random() * 10;
  el.style.cssText = `
    left: ${left}vw;
    top: -20px;
    width: ${size}px;
    height: ${size * 1.5}px;
    background: ${col};
    animation-duration: ${dur}s;
  `;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), dur * 1000 + 200);
}

// ============================
//  カラーユーティリティ
// ============================
function shadeColor(hex, amt) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, Math.min(255, r + amt));
  g = Math.max(0, Math.min(255, g + amt));
  b = Math.max(0, Math.min(255, b + amt));
  return `rgb(${r},${g},${b})`;
}
function lightenColor(hex, amt) { return shadeColor(hex, amt); }
