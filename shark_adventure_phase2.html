<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🦈 サメくん大冒険！</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
  html, body { width: 100%; height: 100%; overflow: hidden; }
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body {
    background: #03045e;
    font-family: 'Nunito', sans-serif; overflow: hidden;
  }
  #game-wrapper {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* HUD */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 10px 14px; display: flex;
    justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  #score-display {
    background: rgba(255,255,255,0.15); backdrop-filter: blur(6px);
    border-radius: 20px; padding: 5px 14px;
    color: white; font-size: 17px; font-weight: 900;
  }
  #timer-display {
    background: rgba(255,255,255,0.15); backdrop-filter: blur(6px);
    border-radius: 20px; padding: 5px 14px;
    color: white; font-size: 17px; font-weight: 900;
    transition: color 0.3s;
  }
  #timer-display.urgent { color: #ff6b6b; animation: pulse 0.5s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
  #hp-display { display: flex; gap: 3px; }
  .heart { font-size: 20px; filter: drop-shadow(0 0 4px rgba(255,100,100,0.6)); }
  .heart.lost { filter: grayscale(1) opacity(0.4); }

  /* 宝箱HUD */
  #treasure-hud {
    position: absolute; top: 54px; left: 0; right: 0;
    text-align: center; pointer-events: none; font-size: 26px;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    letter-spacing: 8px;
  }
  .treasure-got { animation: treasure-pop 0.4s ease-out forwards; }
  @keyframes treasure-pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.5); }
    100% { transform: scale(1); }
  }

  /* スクリーン */
  .screen {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(3,4,94,0.88); backdrop-filter: blur(8px);
  }
  .screen.hidden { display: none; }
  .screen-emoji { font-size: 72px; margin-bottom: 10px; animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .screen-title { color: white; font-size: 30px; font-weight: 900; text-align: center; text-shadow: 0 2px 16px rgba(0,180,216,0.8); margin-bottom: 6px; }
  .screen-sub { color: rgba(255,255,255,0.7); font-size: 14px; text-align: center; margin-bottom: 22px; line-height: 1.7; }
  .btn {
    background: linear-gradient(135deg, #00b4d8, #0077b6);
    color: white; border: none; border-radius: 30px;
    padding: 13px 36px; font-size: 19px; font-weight: 900;
    font-family: 'Nunito', sans-serif; cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,180,216,0.4);
    transition: transform 0.1s; margin: 5px;
  }
  .btn:active { transform: scale(0.95); }
  .btn-gold {
    background: linear-gradient(135deg, #f4d35e, #f77f00);
    box-shadow: 0 4px 20px rgba(244,211,94,0.4);
  }
  .score-big { color: #f4d35e; font-size: 44px; font-weight: 900; text-shadow: 0 2px 16px rgba(244,211,94,0.5); margin-bottom: 6px; }
  .result-row { color: rgba(255,255,255,0.8); font-size: 15px; margin-bottom: 4px; }

  /* クリア理由ボックス */
  #clear-reason-box {
    background: rgba(244,211,94,0.18);
    border: 3px solid #f4d35e;
    border-radius: 20px;
    padding: 14px 28px;
    margin-bottom: 14px;
    text-align: center;
    animation: reason-in 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  #clear-reason-icon { font-size: 28px; line-height: 1; margin-bottom: 6px; letter-spacing: 2px; }
  #clear-reason-text { font-size: 30px; font-weight: 900; color: #f4d35e; margin-bottom: 4px; text-shadow: 0 2px 12px rgba(0,0,0,0.4); }
  #clear-reason-sub  { font-size: 16px; color: rgba(255,255,255,0.85); }

  /* ゲームオーバー理由ボックス */
  #go-reason-box {
    background: rgba(255,255,255,0.12);
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: 16px 32px;
    margin-bottom: 18px;
    text-align: center;
    animation: reason-in 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes reason-in {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  #go-reason-icon { font-size: 56px; line-height: 1; margin-bottom: 6px; }
  #go-reason-text { font-size: 30px; font-weight: 900; color: #fff; margin-bottom: 4px; text-shadow: 0 2px 12px rgba(0,0,0,0.4); }
  #go-reason-sub  { font-size: 16px; color: rgba(255,255,255,0.75); }

  /* ヒント */
  #hint {
    position: absolute; bottom: 18px; left: 0; right: 0;
    text-align: center; color: rgba(255,255,255,0.4);
    font-size: 12px; pointer-events: none;
  }

  /* スコアポップ */
  .score-pop {
    position: absolute; color: #f4d35e; font-size: 20px;
    font-weight: 900; font-family: 'Nunito', sans-serif;
    pointer-events: none; animation: pop-up 0.8s ease-out forwards;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5); transform: translateX(-50%);
  }
  @keyframes pop-up {
    0% { transform: translateX(-50%) translateY(0) scale(1.2); opacity: 1; }
    100% { transform: translateX(-50%) translateY(-55px) scale(0.8); opacity: 0; }
  }
  .treasure-pop {
    position: absolute; font-size: 32px;
    pointer-events: none; animation: treasure-float 1.2s ease-out forwards;
    transform: translateX(-50%);
  }
  @keyframes treasure-float {
    0% { transform: translateX(-50%) translateY(0) scale(0.5); opacity: 1; }
    60% { transform: translateX(-50%) translateY(-60px) scale(1.3); opacity: 1; }
    100% { transform: translateX(-50%) translateY(-90px) scale(1); opacity: 0; }
  }

  /* 紙吹雪 */
  .confetti {
    position: absolute; width: 10px; height: 10px;
    pointer-events: none; border-radius: 2px;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(900px) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div id="score-display">🐟 <span id="scoreText">0</span></div>
    <div id="timer-display">⏱ <span id="timerText">60</span></div>
    <div id="hp-display">
      <span class="heart" id="h1">❤️</span>
      <span class="heart" id="h2">❤️</span>
      <span class="heart" id="h3">❤️</span>
    </div>
  </div>
  <div id="treasure-hud">
    <span id="t1">📦</span><span id="t2">📦</span><span id="t3">📦</span><span id="t4">📦</span><span id="t5">📦</span><span id="t6">📦</span><span id="t7">📦</span>
  </div>

  <!-- タイトル画面 -->
  <div class="screen" id="titleScreen">
    <div class="screen-emoji">🦈</div>
    <div class="screen-title">サメくん大冒険！</div>
    <div class="screen-sub">
      スワイプでサメを動かして<br>
      お魚を食べよう！🐟<br>
      宝箱を3つ集めたらクリア！🎁<br>
      クラゲにはさわらないでね🪼
    </div>
    <button class="btn" onclick="startGame()">▶ あそぶ！</button>
  </div>

  <!-- クリア画面 -->
  <div class="screen hidden" id="clearScreen">
    <div class="screen-emoji">🎉</div>
    <div class="screen-title">クリア！やったー！</div>
    <div id="clear-reason-box">
      <div id="clear-reason-icon">🎁🎁🎁🎁🎁🎁🎁</div>
      <div id="clear-reason-text">おたから７こゲット！</div>
      <div id="clear-reason-sub">ぜんぶあつめたよ！すごい！</div>
    </div>
    <div class="score-big" id="clearScore">0</div>
    <div class="result-row" id="clearTime"></div>
    <div class="result-row" id="clearFish"></div>
    <div class="screen-sub" style="margin-top:8px">すごいね！さめくんが喜んでいるよ🦈💕</div>
    <button class="btn btn-gold" onclick="startGame()">⭐ もういちど！</button>
  </div>

  <!-- ゲームオーバー画面 -->
  <div class="screen hidden" id="gameoverScreen">
    <div class="screen-emoji" id="goEmoji">😢</div>
    <div class="screen-title">ゲームオーバー</div>
    <div id="go-reason-box">
      <div id="go-reason-icon">⏱</div>
      <div id="go-reason-text">じかんぎれ！</div>
      <div id="go-reason-sub">60びょうたったよ</div>
    </div>
    <div class="score-big" id="finalScore">0</div>
    <div class="screen-sub">もう一度チャレンジしよう！</div>
    <button class="btn" onclick="startGame()">🔄 もういちど</button>
  </div>

  <div id="hint">👆 スワイプで移動　タップでダッシュ　長押しでスピン！</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('game-wrapper');

// --- 効果音（Web Audio API）---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}
function playSound(type) {
  try {
    const ac = getAudio();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    if (type === 'eat') {
      o.type = 'sine'; o.frequency.setValueAtTime(600, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(900, ac.currentTime + 0.1);
      g.gain.setValueAtTime(0.3, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);
      o.start(); o.stop(ac.currentTime + 0.15);
    } else if (type === 'treasure') {
      // キラキラ音（3音）
      [0, 0.08, 0.16].forEach((delay, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.connect(g2); g2.connect(ac.destination);
        o2.type = 'sine';
        o2.frequency.setValueAtTime([800,1000,1200][i], ac.currentTime + delay);
        g2.gain.setValueAtTime(0.25, ac.currentTime + delay);
        g2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + delay + 0.2);
        o2.start(ac.currentTime + delay);
        o2.stop(ac.currentTime + delay + 0.2);
      });
    } else if (type === 'damage') {
      o.type = 'sawtooth'; o.frequency.setValueAtTime(200, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(80, ac.currentTime + 0.2);
      g.gain.setValueAtTime(0.25, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.25);
      o.start(); o.stop(ac.currentTime + 0.25);
    } else if (type === 'clear') {
      const notes = [523, 659, 784, 1047];
      notes.forEach((freq, i) => {
        const o2 = ac.createOscillator(), g2 = ac.createGain();
        o2.connect(g2); g2.connect(ac.destination);
        o2.type = 'sine'; o2.frequency.value = freq;
        g2.gain.setValueAtTime(0.2, ac.currentTime + i * 0.12);
        g2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + i * 0.12 + 0.3);
        o2.start(ac.currentTime + i * 0.12);
        o2.stop(ac.currentTime + i * 0.12 + 0.3);
      });
    } else if (type === 'gameover') {
      o.type = 'sine'; o.frequency.setValueAtTime(400, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(150, ac.currentTime + 0.5);
      g.gain.setValueAtTime(0.2, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.5);
      o.start(); o.stop(ac.currentTime + 0.5);
    } else if (type === 'timeout') {
      o.type = 'square'; o.frequency.setValueAtTime(300, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(200, ac.currentTime + 0.3);
      g.gain.setValueAtTime(0.15, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.3);
      o.start(); o.stop(ac.currentTime + 0.3);
    }
  } catch(e) {}
}

// キャンバスサイズ
function resize() {
  canvas.width = wrapper.clientWidth;
  canvas.height = wrapper.clientHeight;
}
resize();
window.addEventListener('resize', resize);

// ゲーム状態
let state = 'title';
let score = 0;
let hp = 3;
let timeLeft = 60;
let treasures = 0;
let fishEaten = 0;
let animId;
let lastTime = 0;
let invincible = 0;

// サメ
const shark = {
  x: 0, y: 0, w: 100, h: 60,
  vx: 0, vy: 0, speed: 180,
  dashing: false, dashTimer: 0,
  spin: false, spinTimer: 0,
  angle: 0,
};

// エンティティ
let fishes = [], jellies = [], treasureItems = [];
let bubbles = [], particles = [];
let bgBubbles = [];

function makeBgBubble() {
  return {
    x: Math.random() * 480,
    y: Math.random() * 860 + 860,
    r: 2 + Math.random() * 6,
    speed: 20 + Math.random() * 40,
    wobble: Math.random() * Math.PI * 2,
  };
}

let seaweeds = Array.from({length: 6}, (_, i) => ({
  x: 40 + i * 80 + Math.random() * 20,
  segments: 5 + Math.floor(Math.random() * 3),
  phase: Math.random() * Math.PI * 2,
  color: Math.random() > 0.5 ? '#2dc653' : '#4ecdc4',
}));

// タッチ
let touch = { active: false, x: 0, y: 0, startX: 0, startY: 0, startTime: 0 };
let longPressTimer = null;

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  touch.active = true;
  touch.x = t.clientX; touch.y = t.clientY;
  touch.startX = t.clientX; touch.startY = t.clientY;
  touch.startTime = Date.now();
  longPressTimer = setTimeout(() => {
    if (state === 'play') { shark.spin = true; shark.spinTimer = 0.6; spawnSpinEffect(); }
  }, 400);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  touch.x = e.touches[0].clientX; touch.y = e.touches[0].clientY;
  clearTimeout(longPressTimer);
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  clearTimeout(longPressTimer);
  const dt = Date.now() - touch.startTime;
  const dx = touch.x - touch.startX, dy = touch.y - touch.startY;
  if (Math.sqrt(dx*dx+dy*dy) < 12 && dt < 300 && state === 'play') {
    shark.dashing = true; shark.dashTimer = 0.25;
  }
  touch.active = false;
}, { passive: false });

let mouse = { down: false, x: 0, y: 0 };
canvas.addEventListener('mousedown', e => { mouse.down = true; mouse.x = e.offsetX; mouse.y = e.offsetY; });
canvas.addEventListener('mousemove', e => { mouse.x = e.offsetX; mouse.y = e.offsetY; });
canvas.addEventListener('mouseup', () => { mouse.down = false; });

function getInputPos() {
  if (touch.active) {
    const r = canvas.getBoundingClientRect();
    return { x: (touch.x - r.left) * (canvas.width / r.width), y: (touch.y - r.top) * (canvas.height / r.height), active: true };
  }
  if (mouse.down) return { x: mouse.x, y: mouse.y, active: true };
  return { active: false };
}

// ---- スタート ----
function startGame() {
  ['titleScreen','clearScreen','gameoverScreen'].forEach(id => document.getElementById(id).classList.add('hidden'));
  document.getElementById('hint').style.display = 'block';
  state = 'play';
  score = 0; hp = 3; timeLeft = 60; treasures = 0; fishEaten = 0; invincible = 0;
  fishes = []; jellies = []; treasureItems = []; bubbles = []; particles = [];
  bgBubbles = Array.from({length: 12}, makeBgBubble);
  shark.x = canvas.width * 0.3; shark.y = canvas.height * 0.5;
  shark.vx = 0; shark.vy = 0; shark.dashing = false; shark.spin = false; shark.angle = 0;
  updateHpDisplay(); updateScore(); updateTimerDisplay(); updateTreasureDisplay();
  cancelAnimationFrame(animId);
  lastTime = performance.now();
  animId = requestAnimationFrame(loop);
  scheduleSpawn();
}

let spawnTimeouts = [];
function scheduleSpawn() {
  spawnTimeouts.forEach(t => clearTimeout(t));
  spawnTimeouts = [];
  function spawnFish() {
    if (state !== 'play') return;
    spawnRandomFish();
    spawnTimeouts.push(setTimeout(spawnFish, 1100 + Math.random() * 700));
  }
  function spawnJelly() {
    if (state !== 'play') return;
    spawnJellyfish();
    spawnTimeouts.push(setTimeout(spawnJelly, 2800 + Math.random() * 1800));
  }
  function spawnTreasure() {
    if (state !== 'play') return;
    if (treasureItems.length < 2 && treasures < 7) spawnTreasureItem();
    spawnTimeouts.push(setTimeout(spawnTreasure, 5000 + Math.random() * 3000));
  }
  spawnTimeouts.push(setTimeout(spawnFish, 500));
  spawnTimeouts.push(setTimeout(spawnJelly, 2000));
  spawnTimeouts.push(setTimeout(spawnTreasure, 3000));
}

const fishTypes = [
  { emoji: '🐟', score: 10, size: 30 },
  { emoji: '🐠', score: 15, size: 30 },
  { emoji: '🐡', score: 20, size: 34 },
];

function spawnRandomFish() {
  const fromRight = Math.random() > 0.5;
  const type = fishTypes[Math.floor(Math.random() * fishTypes.length)];
  fishes.push({
    x: fromRight ? canvas.width + 20 : -20,
    y: 90 + Math.random() * (canvas.height - 180),
    vx: fromRight ? -(80 + Math.random() * 60) : (80 + Math.random() * 60),
    vy: (Math.random() - 0.5) * 40,
    size: type.size, emoji: type.emoji, score: type.score,
    alive: true, wave: Math.random() * Math.PI * 2,
  });
}

function spawnJellyfish() {
  const fromRight = Math.random() > 0.5;
  jellies.push({
    x: fromRight ? canvas.width + 20 : -20,
    y: 100 + Math.random() * (canvas.height - 220),
    vx: fromRight ? -(40 + Math.random() * 30) : (40 + Math.random() * 30),
    size: 36, alive: true, bob: 0,
  });
}

function spawnTreasureItem() {
  const fromRight = Math.random() > 0.5;
  treasureItems.push({
    x: fromRight ? canvas.width + 20 : -20,
    y: 100 + Math.random() * (canvas.height - 220),
    vx: fromRight ? -(35 + Math.random() * 20) : (35 + Math.random() * 20),
    alive: true, bob: Math.random() * Math.PI * 2,
    glow: 0,
  });
}

function spawnSpinEffect() {
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    particles.push({ x: shark.x, y: shark.y, vx: Math.cos(a)*120, vy: Math.sin(a)*120, life: 0.4, maxLife: 0.4, color: '#90e0ef', size: 8 });
  }
}

function spawnEatEffect(x, y, pts) {
  for (let i = 0; i < 6; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 80;
    bubbles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 40, r: 4 + Math.random()*6, life: 0.5 + Math.random()*0.3 });
  }
  addPop(x, y, '+' + pts);
}

function spawnTreasureEffect(x, y) {
  const el = document.createElement('div');
  el.className = 'treasure-pop'; el.textContent = '🎁';
  el.style.left = (x / canvas.width * 100) + '%';
  el.style.top = (y / canvas.height * 100) + '%';
  wrapper.appendChild(el);
  setTimeout(() => el.remove(), 1200);
  // きらきらパーティクル
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    particles.push({ x, y, vx: Math.cos(a)*150, vy: Math.sin(a)*150 - 40, life: 0.6, maxLife: 0.6, color: '#f4d35e', size: 10 });
  }
}

function addPop(x, y, text) {
  const el = document.createElement('div');
  el.className = 'score-pop'; el.textContent = text;
  el.style.left = (x / canvas.width * 100) + '%';
  el.style.top = (y / canvas.height * 100) + '%';
  wrapper.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function spawnDamageEffect() {
  canvas.style.filter = 'brightness(2) saturate(3) hue-rotate(300deg)';
  setTimeout(() => { canvas.style.filter = ''; }, 150);
}

function spawnConfetti() {
  const colors = ['#f4d35e','#ff6b6b','#4ecdc4','#a8e6cf','#ff8b94','#ffd3b6'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + '%';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.style.animationDelay = Math.random() * 0.5 + 's';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    wrapper.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }
}

function updateHpDisplay() {
  ['h1','h2','h3'].forEach((id, i) => document.getElementById(id).classList.toggle('lost', i >= hp));
}
function updateScore() { document.getElementById('scoreText').textContent = score; }
function updateTimerDisplay() {
  const el = document.getElementById('timerText');
  el.textContent = Math.ceil(timeLeft);
  document.getElementById('timer-display').classList.toggle('urgent', timeLeft <= 10);
}
function updateTreasureDisplay() {
  ['t1','t2','t3','t4','t5','t6','t7'].forEach((id, i) => {
    document.getElementById(id).textContent = i < treasures ? '🎁' : '📦';
  });
}

// ---- メインループ ----
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  if (state !== 'play') return;
  update(dt);
  render();
  animId = requestAnimationFrame(loop);
}

function update(dt) {
  const W = canvas.width, H = canvas.height;

  // タイマー
  timeLeft -= dt;
  updateTimerDisplay();
  if (timeLeft <= 0) {
    timeLeft = 0;
    playSound('timeout');
    gameOver('timeout');
    return;
  }

  // 操作
  const inp = getInputPos();
  if (inp.active && !shark.spin) {
    const dx = inp.x - shark.x, dy = inp.y - shark.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 8) {
      const spd = shark.dashing ? shark.speed * 2.5 : shark.speed;
      shark.vx += (dx / dist * spd - shark.vx) * 10 * dt;
      shark.vy += (dy / dist * spd - shark.vy) * 10 * dt;
      shark.angle = Math.atan2(dy, dx);
    }
  } else if (!shark.spin) {
    shark.vx *= 0.85; shark.vy *= 0.85;
  }

  if (shark.dashTimer > 0) { shark.dashTimer -= dt; if (shark.dashTimer <= 0) shark.dashing = false; }
  if (shark.spin) {
    shark.spinTimer -= dt; shark.angle += dt * 20;
    shark.vx *= 0.9; shark.vy *= 0.9;
    if (shark.spinTimer <= 0) shark.spin = false;
  }

  shark.x = Math.max(shark.w/2, Math.min(W - shark.w/2, shark.x + shark.vx * dt));
  shark.y = Math.max(80 + shark.h/2, Math.min(H - shark.h/2, shark.y + shark.vy * dt));
  if (invincible > 0) invincible -= dt;

  // 魚
  for (const f of fishes) {
    f.wave += dt * 2; f.x += f.vx * dt; f.y += f.vy * dt + Math.sin(f.wave) * 0.5;
    if (f.x < -60 || f.x > W + 60) { f.alive = false; continue; }
    if (f.alive) {
      const dx = f.x - shark.x, dy = f.y - shark.y;
      const hit = shark.spin ? 110 : 60;
      if (dx*dx + dy*dy < hit*hit) {
        f.alive = false; score += f.score; fishEaten++; updateScore();
        spawnEatEffect(f.x, f.y, f.score); playSound('eat');
      }
    }
  }
  fishes = fishes.filter(f => f.alive);

  // クラゲ
  for (const j of jellies) {
    j.bob += dt; j.x += j.vx * dt; j.y += Math.sin(j.bob * 1.2) * 0.8;
    if (j.x < -60 || j.x > W + 60) { j.alive = false; continue; }
    if (j.alive && invincible <= 0) {
      const dx = j.x - shark.x, dy = j.y - shark.y;
      if (dx*dx + dy*dy < 60*60) {
        hp--; invincible = 1.5; updateHpDisplay(); spawnDamageEffect(); playSound('damage');
        if (hp <= 0) { gameOver('jelly'); return; }
      }
    }
  }
  jellies = jellies.filter(j => j.alive);

  // 宝箱
  for (const t of treasureItems) {
    t.bob += dt * 2; t.x += t.vx * dt; t.glow += dt * 3;
    if (t.x < -60 || t.x > W + 60) { t.alive = false; continue; }
    if (t.alive) {
      const dx = t.x - shark.x, dy = t.y - shark.y;
      if (dx*dx + dy*dy < 65*65) {
        t.alive = false; treasures++; score += 50;
        updateScore(); updateTreasureDisplay();
        spawnTreasureEffect(t.x, t.y); playSound('treasure');
        if (treasures >= 7) { stageClear(); return; }
      }
    }
  }
  treasureItems = treasureItems.filter(t => t.alive);

  // 泡
  for (const b of bubbles) { b.x += b.vx * dt; b.y += b.vy * dt; b.vy -= 80 * dt; b.life -= dt; }
  bubbles = bubbles.filter(b => b.life > 0);

  // パーティクル
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);

  // 背景泡
  for (const b of bgBubbles) {
    b.y -= b.speed * dt; b.x += Math.sin(b.wobble + b.y * 0.02) * 0.5;
    if (b.y < -20) { b.y = H + 20; b.x = Math.random() * W; }
  }
}

function render() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // 背景
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#48cae4'); grad.addColorStop(0.4, '#0096c7'); grad.addColorStop(1, '#03045e');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

  // 光の筋
  ctx.save(); ctx.globalAlpha = 0.06;
  for (let i = 0; i < 6; i++) {
    const x = W * 0.1 + i * W * 0.15;
    ctx.fillStyle = '#ffffff'; ctx.beginPath();
    ctx.moveTo(x-10, 0); ctx.lineTo(x+10, 0); ctx.lineTo(x+60, H*0.6); ctx.lineTo(x+30, H*0.6);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // 背景泡
  for (const b of bgBubbles) {
    ctx.save(); ctx.globalAlpha = 0.18; ctx.strokeStyle = '#90e0ef'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.stroke(); ctx.restore();
  }

  drawSeaweeds(W, H);

  // 宝箱
  const now = Date.now() * 0.001;
  for (const t of treasureItems) {
    ctx.save();
    ctx.translate(t.x, t.y + Math.sin(t.bob) * 5);
    // 光るオーラ
    ctx.globalAlpha = 0.3 + 0.2 * Math.sin(t.glow);
    ctx.fillStyle = '#f4d35e';
    ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = '36px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('📦', 0, 0);
    // キラキラ
    for (let i = 0; i < 3; i++) {
      const a = t.glow + i * 2.1, r = 26;
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t.glow * 2 + i);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 2.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // 魚
  for (const f of fishes) {
    ctx.save(); ctx.translate(f.x, f.y);
    if (f.vx > 0) ctx.scale(-1, 1);
    ctx.font = f.size + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.emoji, 0, 0);
    ctx.restore();
  }

  // クラゲ
  for (const j of jellies) {
    ctx.save(); ctx.translate(j.x, j.y);
    ctx.font = j.size + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🪼', 0, 0);
    if (invincible <= 0) {
      ctx.globalAlpha = 0.25 + 0.15 * Math.sin(Date.now() * 0.01);
      ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }

  // 泡エフェクト
  for (const b of bubbles) {
    ctx.save(); ctx.globalAlpha = Math.max(0, b.life * 2);
    ctx.strokeStyle = '#e0f4ff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.stroke(); ctx.restore();
  }

  // パーティクル
  for (const p of particles) {
    ctx.save(); ctx.globalAlpha = p.life / p.maxLife; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI*2); ctx.fill(); ctx.restore();
  }

  drawShark();
}

function drawSeaweeds(W, H) {
  const now = Date.now() * 0.001;
  for (const sw of seaweeds) {
    ctx.strokeStyle = sw.color; ctx.lineWidth = 6;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    let px = sw.x, py = H - 10; ctx.moveTo(px, py);
    for (let i = 0; i < sw.segments; i++) {
      px += Math.sin(now + sw.phase + i * 0.8) * 8; py -= 22; ctx.lineTo(px, py);
    }
    ctx.globalAlpha = 0.6; ctx.stroke(); ctx.globalAlpha = 1;
  }
}

function drawShark() {
  ctx.save();
  ctx.translate(shark.x, shark.y);
  ctx.rotate(shark.angle);
  if (invincible > 0 && Math.floor(invincible * 8) % 2 === 0) ctx.globalAlpha = 0.3;

  if (shark.spin) {
    ctx.save(); ctx.globalAlpha = 0.3; ctx.strokeStyle = '#90e0ef'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 65, 0, Math.PI*2); ctx.stroke(); ctx.restore();
  }
  if (shark.dashing) {
    ctx.save(); ctx.globalAlpha = 0.2;
    for (let i = 1; i <= 3; i++) { ctx.translate(-18, 0); drawSharkShape(); }
    ctx.restore();
  }
  drawSharkShape();
  ctx.restore();
}

function drawSharkShape() {
  ctx.fillStyle = '#FF6B00';
  ctx.beginPath(); ctx.ellipse(0, 0, 38, 18, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FFD700';
  ctx.beginPath(); ctx.ellipse(4, 5, 26, 11, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FF6B00';
  ctx.beginPath(); ctx.moveTo(-30,0); ctx.lineTo(-52,-18); ctx.lineTo(-42,0); ctx.lineTo(-52,18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#CC4400';
  ctx.beginPath(); ctx.moveTo(-44,-2); ctx.lineTo(-52,-18); ctx.lineTo(-42,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FF4500';
  ctx.beginPath(); ctx.moveTo(-5,-17); ctx.lineTo(8,-40); ctx.lineTo(22,-17); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FF6B00';
  ctx.beginPath(); ctx.moveTo(5,14); ctx.lineTo(18,34); ctx.lineTo(-8,16); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#882200'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, 38, 18, 0, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(28,-6,7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(29,-6,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(31,-8,1.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#CC0000';
  ctx.beginPath(); ctx.moveTo(32,-1); ctx.lineTo(46,3); ctx.lineTo(32,9); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'white';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(34+i*4,0); ctx.lineTo(36+i*4,5); ctx.lineTo(38+i*4,0); ctx.closePath(); ctx.fill();
  }
}

function stageClear() {
  state = 'clear';
  spawnTimeouts.forEach(t => clearTimeout(t));
  playSound('clear');
  spawnConfetti();
  const elapsed = 60 - timeLeft;
  document.getElementById('clearScore').textContent = score + 'てん！';
  document.getElementById('clearTime').textContent = '⏱ クリアタイム：' + Math.ceil(elapsed) + '秒';
  document.getElementById('clearFish').textContent = '🐟 たべたおさかな：' + fishEaten + 'ひき';
  document.getElementById('clearScreen').classList.remove('hidden');
  document.getElementById('hint').style.display = 'none';
}

function gameOver(reason = 'other') {
  state = 'gameover';
  spawnTimeouts.forEach(t => clearTimeout(t));
  playSound('gameover');

  const reasons = {
    timeout: { emoji: '😢', icon: '⏱', text: 'じかんぎれ！',   sub: '60びょうたったよ。つぎはもっとはやく！',     border: '#f4a261' },
    jelly:   { emoji: '😵', icon: '🪼', text: 'クラゲにやられた！', sub: 'クラゲにさわってハートがなくなっちゃった…', border: '#ff6b6b' },
    other:   { emoji: '😢', icon: '💦', text: 'ゲームオーバー！',  sub: 'もう一回チャレンジしよう！',               border: '#90e0ef' },
  };
  const r = reasons[reason] || reasons.other;

  document.getElementById('goEmoji').textContent       = r.emoji;
  document.getElementById('go-reason-icon').textContent = r.icon;
  document.getElementById('go-reason-text').textContent = r.text;
  document.getElementById('go-reason-sub').textContent  = r.sub;
  document.getElementById('go-reason-box').style.borderColor = r.border;

  // アニメーションをリセットして再生
  const box = document.getElementById('go-reason-box');
  box.style.animation = 'none';
  box.offsetHeight; // reflow
  box.style.animation = '';

  document.getElementById('finalScore').textContent = score + 'てん！';
  document.getElementById('gameoverScreen').classList.remove('hidden');
  document.getElementById('hint').style.display = 'none';
}

// タイトル背景アニメ
function bgLoop(ts) {
  if (state === 'title') { render(); requestAnimationFrame(bgLoop); }
}
shark.x = 200; shark.y = 300; shark.angle = 0;
bgLoop(0);
</script>
